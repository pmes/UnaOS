# DEPS (SR31, R83): rows that MUST wait behind crates.io's latest stable.
#
# `tools/deps-audit/run.py --check` fails on every dependency behind latest stable (policy `any`)
# EXCEPT the crates pinned here. Each pin carries:
#   crate    the crates.io name
#   reason   why it cannot move yet (one sentence, it lands in docs/dev/DEPS.md)
#   ledger   the ledger row that owns the wait (the pin dies with that row)
#   until    optional: the newest stable this pin anticipated; a newer release re-opens the gate
#
# A pin whose row has become current is reported as stale by --check: delete it.
