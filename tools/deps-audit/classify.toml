# DEPS (SR31, R83): the CHICKEN-WIRE verdicts read by tools/deps-audit/run.py.
#
# A crate listed here does the work of a capability UnaOS claims (R83: "built in UnaOS whenever
# possible ... NO CHICKEN WIRE"). Every crate NOT listed is a UTILITY (async runtime, CLI parsing,
# error types, FFI glue, bit-twiddling, data tables ...).
#
#   capability   what the crate does that UnaOS claims
#   verdict      CUT         — the UnaOS core that replaces it is an open arc (named in `replacement`)
#                OWED        — no arc yet; `replacement` proposes the arc and the crate
#                NOT WANTED  — UnaOS will not replace it on this ring; `replacement` says why
#   replacement  the arc / crate / reason (one line, it is a table cell)

# ---------------------------------------------------------------- web engine (Aether)
[chicken_wire.boa_engine]
capability = "JavaScript engine (ECMA-262 parser, bytecode VM, builtins)"
verdict = "OWED"
replacement = "arc JSCORE — `unaos/libs/web/js_core` (no_std ECMA-262 interpreter; oracle: test262 subset vs Chromium)"

[chicken_wire.boa_gc]
capability = "JavaScript engine garbage collector (boa's tracing GC)"
verdict = "OWED"
replacement = "arc JSCORE — goes with boa_engine (the GC lives inside `js_core`)"

[chicken_wire.html5ever]
capability = "HTML parser (WHATWG tokenizer + tree builder)"
verdict = "OWED"
replacement = "arc HTMLCORE — `unaos/libs/web/html_core` (WHATWG §13 tokenizer/tree builder + DOM arena; oracle: html5lib-tests, Chromium DOM dump)"

[chicken_wire.kuchiki]
capability = "DOM tree + CSS-selector queries over html5ever (unmaintained since 2020)"
verdict = "OWED"
replacement = "arc HTMLCORE — the DOM arena in `html_core` replaces it; kuchiki 0.8.1 is the last release and drags html5ever 0.25, selectors 0.22 and cssparser 0.27 into the lock"

[chicken_wire.cssparser]
