#
# BANDY-1 golden-frame capture (ROADMAP §3b arc 1, verdict A as ruled at the arc's STOP:
# reply bodies are HOST-golden). This host-native tool links the REAL `bandy` crate read-only
# and serializes the on-UnaOS bus's reply-subset `SMessage` variants (`TerminalOutput`,
# `TerminalError`) with the REAL host serializer (serde_json) — the captured bytes are the
# goldens the kernel-side codec KATs (`arch/aarch64/bus.rs::bus_codec_selftest`) are frozen
# against. Goldens are NEVER hand-authored: re-run this tool to regenerate
# `golden-frames.txt`; a diff there = the host wire shape moved = a protocol break to rule on.

[package]
name = "bandy-golden"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bandy = { path = "../../libs/bandy" }
serde_json = "1.0"
