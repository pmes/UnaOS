<!doctype html>
<html>
<head><title>AETHERVIDEO oracle</title></head>
<body style="margin:0;background:#ffffff">
<!-- Case 1, 1:1: Aether picks the utp1 stream (Stria decodes it for real), Chromium cannot play
     utp1 and takes the VP9 encoding of the same frames. Same page, same frames, two decoders. -->
<video width="320" height="240" style="position:absolute;left:0;top:0">
  <source src="pattern-utp.webm" type='video/webm; codecs="utp1"'>
  <source src="pattern-vp9.webm" type='video/webm; codecs="vp9"'>
</video>
<!-- Case 2, object-fit contain (the default): the 4:3 frame letterboxed into a 300x100 box on a
     grey background. -->
<video width="300" height="100" style="position:absolute;left:330;top:0;left:330px;background:#808080">
  <source src="pattern-utp.webm" type='video/webm; codecs="utp1"'>
  <source src="pattern-vp9.webm" type='video/webm; codecs="vp9"'>
</video>
<!-- Case 3, the SAME file in both: the VP9 stream. Chromium decodes it; Stria has no VP9
     decoder yet and paints its labelled test-pattern stand-in at the frame's pts. -->
<video src="pattern-vp9.webm" width="320" height="240" style="position:absolute;left:0;top:250px"></video>
</body>
</html>
