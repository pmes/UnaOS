[package]
name = "eyes"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "EYES: render a subject to PNG, render an oracle to PNG, diff, score, gate. Generic over what produces the pixels."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1"
