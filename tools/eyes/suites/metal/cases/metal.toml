# One case per `shot` state. File names are the kernel's 8.3 spellings (FAT's create path is 8.3 only):
# <STEM>.PNG + <STEM>.MSK; the runner also accepts <state>.png + <state>.mask.png (long names, after FATLFN).
# `mask` rectangles [x, y, w, h] are ADDED to the kernel's mask PNG (EYES's own field; empty = the PNG alone).

[[case]]
name = "login"
subject = { kind = "png", path = "{from}/LOGIN.PNG" }
oracle = { kind = "golden", path = "golden/login.png" }
mask_png = "{from}/LOGIN.MSK"
mask = []

