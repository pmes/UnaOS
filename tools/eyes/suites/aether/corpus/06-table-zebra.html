<!-- tests: a data table: border-collapse, cell borders, th styling, zebra rows via :nth-child, caption, right-aligned numbers -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Table</title>
<style>
body { font-family: sans-serif; padding: 20px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
caption { text-align: left; font-weight: bold; padding-bottom: 8px; font-size: 16px; }
th, td { border: 1px solid #bbb; padding: 6px 10px; text-align: left; }
th { background: #34495e; color: white; }
tr:nth-child(even) td { background: #ecf0f1; }
td.num { text-align: right; }
</style></head><body>
<table>
<caption>Quarterly results</caption>
<thead><tr><th>Region</th><th>Q1</th><th>Q2</th><th>Q3</th></tr></thead>
<tbody>
<tr><td>North</td><td class="num">1,204</td><td class="num">1,377</td><td class="num">1,502</td></tr>
<tr><td>South</td><td class="num">980</td><td class="num">1,045</td><td class="num">1,110</td></tr>
<tr><td>East</td><td class="num">1,560</td><td class="num">1,498</td><td class="num">1,620</td></tr>
<tr><td>West</td><td class="num">875</td><td class="num">930</td><td class="num">1,012</td></tr>
<tr><td>Central</td><td class="num">1,333</td><td class="num">1,290</td><td class="num">1,401</td></tr>
</tbody></table>
</body></html>
