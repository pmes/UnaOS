# The facet.toml subjects scored against CHROMIUM itself, live: each case's page shows the same
# fixture with the same view/edit in CSS, shot by tools/eyes/ref.mjs at the page's own viewport.
# card-resize is expected to differ (Chromium smooth-scales with a different filter; recorded).

[[case]]
name = "card-actual@chromium"
page = "pages/card-actual.html"
width = 48
height = 32
[case.subject]
run = "{repo}/target/release/facet render {suite}/fixtures/card.png --zoom actual --out {out}"
[case.oracle]
kind = "chromium"
url = "file://{page}"

