[[case]]
name = "card-resize"
page = "pages/card-resize.html"
max_delta = 0
note = "triangle filter; Chromium smooth-scales with another filter (PSNR ~30 dB, recorded, not gated)"
[case.subject]
run = "{repo}/target/release/facet render {suite}/fixtures/card.png --resize 30x20 --zoom actual --out {out}"

[[case]]
name = "card-fit"
