[package]
name = "unafs-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "unafs"
path = "src/main.rs"

[dependencies]
# The Core Logic
unafs = { path = "../../unaos/libs/fs/unafs" }
bandy = { path = "../../libs/bandy" }
# CARDREGISTRY (B833): the FILETYPES registry's objects and stamp, the kernel's own values (`filetypes`).
type_registry_core = { path = "../../unaos/libs/sys/type_registry_core" }

# CLI Utilities
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.53", features = ["full"] }
