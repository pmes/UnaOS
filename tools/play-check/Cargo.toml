# =====================================================================
# CRATE: tools/play-check/Cargo.toml
# DESCRIPTION: PLAYBACK (LEDGER SR26) headless face: plays a media file
#              through Stria's player on a manual clock, writes frame N
#              as PNG, and checks the presented pts sequence against the
#              Chromium oracle. No third-party crates.
# =====================================================================

[package]
name = "play-check"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
stria = { path = "../../handlers/stria" }
gneiss_pal = { path = "../../libs/gneiss_pal" }
# PLAYCHECKHI (LEDGER SR352): the I420Hi oracle and `--md5` take HEVCCONF's ONE layout (`hevc_core::yuv_bytes` /
# `le_bytes`) and crypto_core's MD5.
hevc_core = { path = "../../unaos/libs/media/hevc_core" }
crypto_core = { path = "../../unaos/libs/sys/crypto_core" }

[dev-dependencies]
# The hevc_core test kit (included by path in the unit tests) imports h264_core's CABAC tables.
h264_core = { path = "../../unaos/libs/media/h264_core" }
