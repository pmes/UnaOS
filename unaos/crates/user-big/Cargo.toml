#
# RING3WIN M4 (rmbp-ledger B316): BIG.ELF — the proof program for the ELF window. Linked at
# una_abi::USER_XWIN_VA_X86 (crates/user-big/user-big-x86.ld), so the kernel places it in the elf model:
# a 64 KiB static array (BSS) it fills and checksums, a 32 KiB stack frame it recurses into on a declared
# 256 KiB stack (PT_GNU_STACK via `-z stack-size`), and a 100 KiB `alloc::vec::Vec` on a SYS_SBRK heap.
# x86_64 only (the ELF window is x86's this arc). Built by arroyo's build_user_big_x86, staged as
# APPS/BIG.ELF; `tests ring3win` runs it.
#
# The empty [workspace] table makes this crate its OWN workspace root (the user-prefs idiom).
[workspace]

[package]
name = "user-big"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-big"
path = "src/main.rs"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true

[dependencies]
una-abi = { path = "../una-abi" }
