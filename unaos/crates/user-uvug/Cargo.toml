#
# UVUG-1: the first real EL0 graphics program — a userspace mini-vug. Like `user-elf` (ELFHELLO), this
# crate's link product is kept AS AN ELF64 and handed to the kernel's aarch64 loader (validate + walk the
# PT_LOAD program headers + map each segment with per-segment permissions). Unlike the single-routine
# ELFHELLO, this program maps an off-screen surface (SYS_FB_MAP), spawns two EL0 worker threads
# (SYS_THREAD_SPAWN) that render halves of an animated pattern under a FUTEX frame barrier, presents each
# frame (SYS_FB_PRESENT), and after a bounded number of frames joins both workers, computes a deterministic
# surface checksum, prints the `:: UVUG: … ::` witness, and exits 0. `arroyo kernel8` builds it for the
# bare aarch64 target with its own linker script (crates/user-uvug/user-uvug.ld — two PT_LOAD segments via
# a PHDRS clause) and stages the ELF onto the FAT media as UVUG.ELF.
#
# The empty [workspace] table makes this crate its OWN workspace root, so the parent UnaOS workspace never
# tries to build this no_std/no_main EL0 program for the host toolchain during `./arroyo check`.
[workspace]

[package]
name = "user-uvug"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-uvug"
path = "src/main.rs"

# Tiny freestanding program: size-optimised, panic=abort (no unwinder in a no_std EL0 program), lto folds
# the routines. No dependencies.
[profile.release]
opt-level = "s"
panic = "abort"
lto = true
