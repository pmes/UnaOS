# x86_64 only (the user-abiprobe config: MICRING3.ELF allocates nothing). The builder passes the linker script via
# RUSTFLAGS and the target explicitly.
[build]
target = "../../x86_64-unknown-none.json"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
