[package]
name = "bootloader"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Additive UEFI boot-time diagnostics for the Jetson Orin headless bring-up (JM2). Prints, BEFORE the
# GOP lookup: firmware vendor/revision + UEFI spec revision, the GraphicsOutput handle COUNT (JM1 saw
# get_handle_for_protocol → NOT_FOUND), ConOut's device path, and — the UART truth — the DTB /chosen
# stdout-path + serial aliases (which UART the firmware drives as console, so JM3 knows whether the
# tegra driver's UARTC base is right). Pulls in `fdt` to parse the device tree. OFF by default, so a
# non-bootdiag build is byte-identical. Enabled by arroyo via UNAOS_BOOTDIAG=1.
bootdiag = ["dep:fdt"]
# JB8 lever (Jetson Orin bench): pre-ExitBootServices disconnect+reconnect of the Usb2Hc handles to
# force a fresh XhciControllerDxe.Start (fresh Falcon firmware load) right before handoff. Bench-only
# risk media — OFF by default; enabled by arroyo via UNAOS_JB8_LEVER=1. aarch64-only code paths.
jb8lever = []
unaos_ivb = ["unaos-boot-info/unaos_ivb"]

[dependencies]
uefi = { version = "0.38.0", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
log = "0.4.21"
xmas-elf = "0.10.0"
unaos-boot-info = { path = "../boot-info" }
# Only compiled with the `bootdiag` feature (device-tree parsing for the stdout-path/aliases dump).
fdt = { version = "0.1.5", optional = true }
