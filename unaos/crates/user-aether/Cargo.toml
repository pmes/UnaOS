# AETHERMETAL M1 (LEDGER SR66): `APPS/AETHER.ELF` — Aether, UnaOS's browser, as ONE ring-3 program on the image,
# in the LUMENAPP shape (B323, R82): one compositor window (SYS_WIN_CREATE .. SYS_WIN_PRESENT, the INPUT_EV_*
# ring), the DejaVu faces off the volume through font_core::ui, linked in the ELF window (user-aether-x86.ld).
# It opens an HTML file off the volume (/system/doc/welcome.html), parses it with html_core, cascades it with
# css_core (the page's <style> + style=""), lays it out with layout_core — LAYOUTCORE (SR76, AETHERMETAL M2): the
# host engine's own layout (box generation, the taffy mapping, the inline formatter, tables), no_std, the SAME
# crate handlers/aether lays out with; M1's in-crate formatter is deleted — and paints the LayoutTree with font_core.
#
# The empty [workspace] table makes this crate its OWN workspace root, so the parent workspace never builds
# this no_std/no_main program for the host during `./arroyo check`.
[workspace]

[package]
name = "user-aether"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-aether"
path = "src/main.rs"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1

# una-abi: the syscall numbers, the INPUT_EV_* layout, the window landmarks (zero bytes).
# html_core / css_core / font_core / layout_core: the shared no_std cores (CODEX §2 seam `shared-core`) — the SAME
# crates the host engine links and the kernel's video::text links (font_core). layout_core pins taffy 0.15 without std.
# font8x8: the glyph grid when no face is on the volume (the SAME crate Lumen and the kernel link).
[dependencies]
una-abi = { path = "../una-abi" }
# PALETTECORE (rmbp-ledger B559): the one no_std palette (LIGHT / DARK / ACCENTS, Look, the role struct) the kernel's
# video/theme.rs re-exports — theme.rs maps this program's roles over it; zero deps, no alloc.
palette_core = { path = "../../libs/sys/palette_core" }
html_core = { path = "../../libs/web/html_core" }
css_core = { path = "../../libs/web/css_core" }
font_core = { path = "../../libs/text/font_core" }
layout_core = { path = "../../libs/web/layout_core" }
font8x8 = { version = "0.3.1", default-features = false }
# AETHERNET (LEDGER SR110): pages off the NETWORK — the ring-3 socket ABI, the kernel resolver and verified TLS through
# vein_ring3 (the transport LUMEN.ELF and NET.ELF use: tls_core over CRYPTOCORE, /system/trust/roots.pem at SYS_TIME);
# HTTP/1.1, redirects, content codings and the cookie jar through http_core (no_std + alloc, the SAME core the host
# engine's gneiss_pal transport drives); cookie and partition sites through psl_core (no_std, no alloc).
vein_core = { path = "../../libs/sys/vein_core", default-features = false }
vein_ring3 = { path = "../../libs/sys/vein_ring3" }
http_core = { path = "../../libs/net/http_core" }
psl_core = { path = "../../libs/net/psl_core" }
# AETHERMETAL4 (SR109): the omnibox's buffer of record — Tabula's editing core (SR73), the one the host Tabula and
# UNA.ELF link. The chrome's MODEL is not a dependency: handlers/aether/src/chrome/*.rs (std-free) are linked by
# `#[path]` from src/chrome.rs, because the crate around them is std.
edit_core = { path = "../../libs/text/edit_core" }
# AETHERSIDETABS2 (SR143): the tab's FAVICON — pixel_core (PIXELCORE SR25: no_std + alloc, forbid(unsafe), no default
# features; the SAME core the kernel's video/png.rs links and http_core already pulls in for its inflater, so no new
# code family enters the ELF) decodes the page's `<link rel=icon>` (PNG/JPEG/GIF/BMP/QOI/WebP) for the strip's tile.
pixel_core = { path = "../../libs/media/pixel_core" }

# AETHERNET (SR110): `cryptocore` is the product crypto provider under tls_core (Lumen's line). It is ON BY DEFAULT here
# because arroyo's build_user_aether_x86 / _aarch64 pass no --features (Lumen's builds pass `--features cryptocore`):
# without it the program runs, and every https:// page refuses with `reason=tls-no-provider` — never an unverified one.
[features]
default = ["cryptocore"]
cryptocore = ["vein_ring3/cryptocore"]
