#
# LUMENAPP (rmbp-ledger B323, R82): `APPS/LUMEN.ELF` — Lumen on UnaOS as ONE program, like the Claude app:
# one compositor window (SYS_WIN_CREATE .. SYS_WIN_PRESENT, the INPUT_EV_* ring) that talks to the
# provider ITSELF through the Vein library — vein_core (pure: Messages encoder, SSE decoder, HTTP framing,
# client, the prefs rules) + vein_ring3 (DNS, TCP, TLS, PREF_GET, the UnaFS key file). No daemon, no bus
# chat verbs (LUMENBIN's VEIN.BIN relay is retired). Linked in the ELF window (user-lumen-x86.ld).
#
# The empty [workspace] table makes this crate its OWN workspace root, so the parent workspace never builds
# this no_std/no_main program for the host during `./arroyo check`.
[workspace]

[package]
name = "user-lumen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-lumen"
path = "src/main.rs"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1

# una-abi: the syscall numbers, the INPUT_EV_* layout, the window landmarks (zero bytes).
# font8x8: the glyph table — the SAME crate the kernel links; only `legacy::BASIC_LEGACY` (1 KiB) is used.
# vein_core / vein_ring3: Vein, linked as a library (the R82 shape).
[dependencies]
una-abi = { path = "../una-abi" }
font8x8 = { version = "0.3.1", default-features = false }
vein_core = { path = "../../libs/sys/vein_core", default-features = false }
vein_ring3 = { path = "../../libs/sys/vein_ring3" }
