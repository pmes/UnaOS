# LUMENAPP (rmbp-ledger B323, R82): `APPS/LUMEN.ELF` — Lumen on UnaOS as ONE program, like the Claude app:
# one compositor window (SYS_WIN_CREATE .. SYS_WIN_PRESENT, the INPUT_EV_* ring) that talks to the
# provider ITSELF through the Vein library — vein_core (pure: Messages encoder, SSE decoder, HTTP framing,
# client, the prefs rules) + vein_ring3 (DNS, TCP, TLS, PREF_GET, the UnaFS key file). No daemon, no bus
# chat verbs (LUMENBIN's VEIN.BIN relay is retired). Linked in the ELF window (user-lumen-x86.ld).
#
# The empty [workspace] table makes this crate its OWN workspace root, so the parent workspace never builds
# this no_std/no_main program for the host during `./arroyo check`.
[workspace]

[package]
name = "user-lumen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-lumen"
path = "src/main.rs"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1

# una-abi: the syscall numbers, the INPUT_EV_* layout, the window landmarks (zero bytes).
# font8x8: the glyph table — the SAME crate the kernel links; only `legacy::BASIC_LEGACY` (1 KiB) is used.
# vein_core / vein_ring3: Vein, linked as a library (the R82 shape); TLS is UnaOS's tls_core over crypto_core.
[dependencies]
una-abi = { path = "../una-abi" }
font8x8 = { version = "0.3.1", default-features = false }
vein_core = { path = "../../libs/sys/vein_core", default-features = false }
vein_ring3 = { path = "../../libs/sys/vein_ring3" }
# KERNELFONT2 (rmbp-ledger B363, R85): the window's text through font_core::ui — the engine the kernel's video::text
# fulfils (KERNELFONT, B359) — from the DejaVu faces on the volume; font8x8 stays the grid when no face is there.
font_core = { path = "../../libs/text/font_core" }

# VEINTLS (SR36): `cryptocore` = CRYPTOCORE's provider under tls_core. The MEDIA build (arroyo's
# build_user_lumen_x86) passes `--features cryptocore`; until CRYPTOCORE's fold file is on the branch that build
# stops at tls_core's cryptocore_provider.rs with the list of what is missing. `./arroyo check` type-checks the
# crate without it (everything but the provider), and an image built without it runs Echo with
# `crypto=built without feature cryptocore` in its start line — never an unverified connection.
[features]
cryptocore = ["vein_ring3/cryptocore"]
