# Make the bare x86_64 build self-contained: build-std (no prebuilt core for a custom target) and a
# default target, so `cargo +nightly build` in this crate needs no extra -Z flags beyond
# json-target-spec. Mirrors crates/user-blob/.cargo/config.toml (aarch64). arroyo/builder pass the
# linker script via RUSTFLAGS. The target is the workspace-root bare x86_64 spec (no OS, softfloat is
# irrelevant here — the blob is a single naked asm stream with no compiler codegen).
[build]
target = "../../x86_64-unknown-none.json"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
