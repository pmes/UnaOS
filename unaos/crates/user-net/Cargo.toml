# NETRING3 M3 (rmbp-ledger B306): NET.ELF — the first ring-3 program to speak to the outside world: entropy
# (SYS_GETRANDOM), the kernel resolver (SYS_RESOLVE), `GET /` over TCP :80, and — VEINTLS (LEDGER SR36) — a
# VERIFIED TLS 1.3 `GET /` over :443 on the same transport LUMEN.ELF uses (vein_ring3: tls_core against
# /system/trust/roots.pem at SYS_TIME). The embedded-tls compile spike (tls-spike/) is retired: deleted.
# Static ELF64 at the ELF window, built by arroyo's build_user_net_x86 (`--features cryptocore`) and staged
# as APPS/NET.ELF on the ESP and the x86 DATA volume.
#
# The empty [workspace] table makes this crate its OWN workspace root, so the parent UnaOS workspace never
# tries to build this no_std/no_main program for the host toolchain during `./arroyo check`.
[workspace]

[package]
name = "user-net"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-net"
path = "src/main.rs"

[profile.release]
opt-level = "s"
panic = "abort"
lto = true

[dependencies]
una-abi = { path = "../una-abi" }
vein_core = { path = "../../libs/sys/vein_core", default-features = false }
vein_ring3 = { path = "../../libs/sys/vein_ring3" }

# CRYPTOCORE's provider under tls_core (the media build passes it; see crates/user-lumen/Cargo.toml).
[features]
cryptocore = ["vein_ring3/cryptocore"]
