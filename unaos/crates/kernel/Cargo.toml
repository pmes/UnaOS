# BT-L0 (GR21): `UNAOS_BT=1` arms the first Bluetooth arc — "does the radio answer?", the direct
# analogue of BCMA-S1, and nothing above it. On the 2012 rMBP the Bluetooth module is a TWO-DEVICE
# unit on EHCI: a Broadcom hub `0a5c:4500` (addr 5, depth 2, FULL SPEED) with the HCI controller as
# its single downstream child at depth 3. UnaOS has never enumerated that child, because the hub
# walk is capped at `depth >= 2` — the radio has been present, powered and answering enumeration
# for the life of the project while we declined to knock.
#
# The knob turns on THREE things that must land together:
#   1. the hub-walk depth cap lifted 2 -> 3 (enough to bring up a hub AT depth 2);
#   2. the TT-INHERITANCE FIX in `bring_up_hub` — a device below a hub that is NOT high speed
#      inherits the nearest HIGH-SPEED ancestor's transaction translator (USB 2.0 §11.14), not its
#      immediate parent's. The Broadcom hub trains at full speed and owns no TT; without this the
#      split transactions would be aimed at `HubAddr=5`, which translates nothing, and the radio
#      would read as DEAD rather than as mis-addressed. Lifting the cap without this fix produces a
#      confident false negative, which is why they are one change and not two;
#   3. the class-0xE0/0x01/0x01 (Wireless/RF/Bluetooth) recognition arm plus the L0 sequence:
#      SET_CONFIGURATION, then `HCI_Reset` (0x0C03) and `HCI_Read_Local_Version_Information`
#      (0x1001) over the CONTROL endpoint (bmRequestType 0x20, bRequest 0x00 — the Bluetooth USB
#      transport, Core Vol 4 Part B), with the replies read off the INTERRUPT-IN event endpoint.
#      The verdict is `Manufacturer_Name` — Broadcom is 0x000F, a value no code path of ours can
#      fabricate.
#
# NO BULK, NO ASYNC SCHEDULE anywhere in this path, and that is a hard constraint rather than a
# simplification: this Panther Point's async schedule master-aborts its first schedule fetch
# (PROBE-14, 13 metal probes), and bulk conventionally rides async. The ACL bulk endpoints are
# named in the witness and never touched. Every wait is bounded (`wait_bounded`'s TSC deadline)
# and the event drain carries a second, structural cap, so a mute radio costs a bounded delay and
# never a hung boot.
#
# Implies `ehcihid` — the entire implementation lives inside `drivers/ehci/mod.rs`, which is gated
# on it; arming `bt` without it would ship a knob whose code does not exist. Default OFF => the
# cap, the TT fix, the recognition arm, the L0 sequence, the `BtEvtEp` type and the `bt_parent`
# field all vanish and a no-BT boot is byte-identical to trunk. The TT fix is a REAL BUG FIX that
# wants to be UNGATED in a follow-up once metal has proven it (it can only ever change behaviour
# below a non-high-speed hub — exactly the tier the depth cap has been hiding). x86_64-only (via
# the `ehcihid` module gate), and stripped from aarch64 compiles by arroyo's `arm_features` so
# aarch64 media stay byte-identical either way. Kept in sync with `unaos/arroyo` AND
# `unaos/builder/src/main.rs` — a knob wired only in arroyo ships disabled while the banner claims
# it is on (the s42/INSTGUI and WXN-M3b lesson).
#
# BT-L1 (GR22): the same knob now carries the first real command/event round-trips beyond the
# version read, still strict bring-up (no pairing, no data). Through the armed event endpoint and
# the existing control path, a small command TABLE runs after the L0 sequence: `HCI_Read_BD_ADDR`
# (0x1009 — the radio's own MAC/identity), `HCI_Read_Buffer_Size` (0x1005 — ACL/SCO packet length
# + count), `HCI_Read_Local_Supported_Features` (0x1003 — proves LE from byte-4 bit-6 of the LMP
# mask rather than inferring it from the 4.0 version), `HCI_Read_Local_Supported_Commands` (0x1002)
# and finally `HCI_Set_Event_Mask` (0x0C01 — the first WRITE, set to the reset default so it is
# idempotent and witnessed by its CommandComplete status). Each command witnesses with the
# `bt-l1:` prefix; a bounded-wait timeout is a clean STOP naming the command, never a hang. The one
# structural addition is MULTI-PACKET EVENT REASSEMBLY in `bt_hci_command`: the event endpoint's
# max packet is 16 B but `_Read_Local_Supported_Commands` returns a 70-byte event, so a whole event
# is now gathered across several interrupt-IN packets (the data toggle advancing on each) before it
# is parsed — the path L2 (LE scan) needs. No new endpoint is armed (mtfix's slot budget holds),
# no async, no bulk; every command is a MANDATORY HCI command, so a status=0x01 (Unknown Command)
# would be the clean-room/patchram boundary and is witnessed as such, not patched around.
#
# BT-L2 (GR22): the same knob now runs an **LE SCAN** after L1 — the first thing this radio does
# that a person can see. Sequence, all through the already-armed event endpoint (no new endpoint,
# so mtfix's slot budget is untouched): `HCI_Set_Event_Mask` (0x0C01) REWRITTEN to
# 0x2000_1FFF_FFFF_FFFF, because L1's value is the spec reset default and the reset default does
# NOT include LE Meta Event (bit 61) — every advertising report rides that bit, and without this
# write a scan runs, hears everything and reports a silent, entirely wrong empty room;
# `HCI_LE_Set_Event_Mask` (0x2001) for the Advertising Report sub-event; `HCI_LE_Set_Scan_Parameters`
# (0x200B) passive, interval == window == 0x0060 (60 ms, continuous), own address public, accept-all
# filter policy; `HCI_LE_Set_Scan_Enable` (0x200C) with filter_duplicates on. Advertising reports
# (event 0x3E subevent 0x02) are then drained for a BOUNDED 500 ms wall-clock window and decoded to
# address, address type, RSSI, event type and the Complete/Shortened Local Name AD structure; one
# `bt-l2:` line per distinct device (cap 16, truncation stated, never silent) plus a rollup.
# Scanning is DISABLED on every exit path that could have started it — including the unconfirmed
# enable — because a radio left scanning burns power and floods the event endpoint for the rest of
# the boot, on the same controller as the internal keyboard and trackpad. The scan starts only from
# a fully confirmed base (L0 reset + version and every L1 row status 0x00, and LE claimed by the LMP
# feature mask); anything else prints why and changes nothing. A status 0x01 (Unknown HCI Command)
# on an LE command is the patchram/.hcd FIRMWARE BOUNDARY (docs/MANIFESTO/CLEAN_ROOM_POLICY.md):
# witnessed and stopped at, never patched around. Boot cost is the 500 ms window plus ~5 control
# transfers; x86-only, and `arm_features` strips the knob so aarch64 media stay byte-identical.
bt = ["ehcihid"]
# BT-C1 (GR24): `UNAOS_BTC=1` arms the FIRST BR/EDR step, and the first thing on this radio aimed at
# AUDIO. Everything `bt` gates is Low Energy; A2DP is not — it runs over classic BR/EDR L2CAP, and
# the first move toward it is to PAGE the speaker with `HCI_Create_Connection` (0x0405). This knob
# adds exactly that one step and its teardown: page, witness `Connection Complete` (event 0x03) or
# the failure status honestly, disconnect (or cancel an unresolved page). No SDP, no L2CAP channel,
# no AVDTP, no audio, and no pairing.
#
# WHY IT IS ITS OWN KNOB AND NOT PART OF `bt`. A page is the loudest thing this project has ever put
# on the air: a directed transmission at a named device that, on a speaker, ANSWERS AUDIBLY, and
# that can take the device away from whatever it is paired to. Every LE stage is passive or bounded
# to a device Peter named; this one makes noise in his room. So a boot that did not ask for a page
# must be structurally incapable of issuing one — a compile-time property, not a runtime check.
#
# Prerequisites, with the Core spec sections: `HCI_Write_Scan_Enable` (Vol 4 Part E §7.3.18) is NOT
# written — it governs INBOUND inquiry/page scan and paging out needs none of it, while enabling it
# would make this machine discoverable. `HCI_Write_Page_Timeout` (§7.3.16) IS written, shortening
# the 5.12 s reset default to 1.28 s so a powered-off speaker cannot cost the boot five seconds.
# Gated additionally on the LMP feature mask NOT setting BR/EDR-Not-Supported.
#
# Implies `bt` (and through it `ehcihid`) — every line lives in the same x86-gated
# `drivers/ehci/mod.rs`. Default OFF => the page code, its constants and the classic latch vanish.
# x86_64 only; `arm_features` strips it so aarch64 media stay byte-identical.
btc = ["bt"]
