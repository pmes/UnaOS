[package]
name = "unaos-kernel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = []
# DEFAULT-QUIET (witness): gate the battery of EL0/kernel fixtures that RE-PROVE long-metal-confirmed
# facts on every boot (x86: nmi-self-fire + canonical-guard + U1a/U1b/U2-0a/U3/U3.5 + the
# U2/U4x/U5x/U6x/U6bx storage chain that cascades U7x..U6gx; aarch64 baremetal: the M6b/M6e/M6d/M6f/M6g
# + U4..U7 chain that cascades U9/U10/U10c/U10d/U11/U11-defer/U11-reap + the K*/F2/F3/BANDY/unafs
# selftests). DEFAULT OFF => those call sites vanish and a default boot reaches the shell with the
# boot-honesty lines only (device/link/calibration/MISSION/CAPSTONE). The regression BATTERIES arm it
# (arroyo/builder push `witness` for `test`/`test-fat`/`test-arm`/`kernel8-test` via UNAOS_WITNESS=1)
# so witness coverage is unchanged-green; the boot/media builds (`x86`/`arm`/`esp-*`/`kernel8`) leave it
# off. Gates CALL SITES only — never the fixture bodies. See review/unaos-default-quiet-LANDING.md.
witness = []
# Skip xHCI/USB bring-up entirely (`pci::init`). For real-hardware video bring-up where the
# firmware/SMM may still own the xHCI controller (this branch has no BIOS->OS handoff) and wedge
# its reset handshake — the controller's status bits never flip, so the bounded-but-slow timeout
# loops stall boot for many seconds before the GUI paints. With this feature the GUI comes up
# immediately; USB is simply absent (no keyboard). Enable via `UNAOS_SKIP_XHCI=1 ./arroyo ...`.
skip_xhci = []
# Hold the fbcon boot log on screen instead of handing the framebuffer to the GUI: dumps the
# effective framebuffer geometry/format (the result of EDID/GOP mode selection) and halts, so the
# whole boot log can be photographed on serial-less hardware. Enable via `UNAOS_BOOTLOG=1`.
bootlog = []
# Raspberry Pi 4 build: the BCM2711 PL011 is not at the QEMU `virt` MMIO address the aarch64 serial
# hardcodes, so don't touch that UART (it would be RAM on the Pi) — rely on fbcon for on-screen
# output, like the Mac. Enable via `UNAOS_PI=1`.
pi = []
# Bare-metal Raspberry Pi 4 boot: build a flat `kernel8.img` the GPU ROM loads directly from the
# microSD slot (no UEFI/EDK2 — which can't read the SD post-handoff). Swaps the UEFI `_start(boot_info)`
# entry for a raw `_start` that sets up a stack, zeroes BSS, enables a minimal MMU (so atomics work),
# builds a BootInfo, and calls kernel_main. Implies `pi`. Enable via `UNAOS_BAREMETAL=1`.
baremetal = ["pi"]
# K2 metal money-shot: turn k2_liveenf_launcher into a REAL two-boot cross-reboot power-cycle proof (instead of
# the same-boot simulate). One image, flashed once, booted twice: boot-1 (K2PRIV.BIN absent) creates+persists+
# LEAVES an owned file; power-cycle; boot-2 (K2PRIV.BIN present) verifies the LIVE boot rebuild reinstalled the
# row across the power-cycle (owner admitted BY NAME / impostor denied), then cleans. For the ATTENDED Pi bench
# only. Enable via `UNAOS_K2_LEAVE=1 ./arroyo kernel8`. OFF => the normal same-boot proof (battery byte-identical).
k2_leave = []
# Run the SMP scheduler demo/self-test at boot (spawns demo threads across the APs, incl. the RwLock
# torn-read check). Opt-in via `UNAOS_SCHED_DEMO=1`: it's a QEMU-verified smoke test whose tick-based
# timing stalls boot for minutes on real hardware (uncalibrated APIC timer). Off => scheduler still
# inits, boot doesn't pause.
sched_demo = []
# USB bring-up debug view for serial-less hardware: run the full main-loop USB path (enumeration +
# storage + hubs) but KEEP the boot log on the framebuffer (no GUI takeover, no fbcon detach) and
# print each input event, so external USB storage/keyboard/mouse enumeration AND live keypresses /
# mouse deltas are visible and photographable on metal. Enable via `UNAOS_USBDEBUG=1`.
usbdebug = []
# STOR-1: interrupt-driven x86 storage — route each storage syscall through a scheduled kernel
# "storage service task" that owns the xHCI BOT pump and blocks the submitter on a completion,
# retiring the staged-buffer family (U6bx staged read / U9x flush queue / U10x op-queue) in favour
# of live in-place reads/writes with synchronous semantics. Default OFF: the staged path compiles
# verbatim (byte-identical). Metal-PENDING (Panther Point transfer-IRQ behaviour is unproven), so it
# lands behind this knob until an attended 2012 bench confirms. x86_64 only. Enable via
# `UNAOS_IRQSTORAGE=1`. See unaos/docs/dev/OS/07_USB_STORAGE/x86_interrupt_storage.md.
irqstorage = []
# VPERF video-path bench instrumentation (x86_64 only — the module is additionally target-gated,
# so aarch64 artifacts are byte-identical with this on or off): scroll/VRAM-read/put_pixel
# counters + serial-only cadence lines, the effective framebuffer memory-type readout (MTRR +
# live PTE + PAT), a PCI class-0x03 display probe, and the deterministic scripted scroll scenario
# the screendump gates compare. Enable via `UNAOS_VIDEOBENCH=1`. Default OFF => byte-identical.
videobench = []
# VPERF M2 viewport-cap bench lever (x86_64 only; implies videobench so the scroll-bytes shrink
# is measurable): halve the fbcon-PRIVATE FrameBuffer handle's `info.height` (rounded to the 8-px
# cell), shrinking the scroll memmove by the cap ratio. Full-surface paints (init fill / clear /
# panic backdrop) still cover the whole real panel via an uncapped twin handle. Enable via
# `UNAOS_VIDEOCAP=1`. Default OFF => byte-identical.
videocap = ["videobench"]
# PORTSW-1: Panther Point EHCI->xHCI port switchover for the 2012 rMBP internal keyboard/trackpad.
# DEFAULT-ON (metal-gated policy 2026-07-16: the no-routing boot dropped ALL external USB on the 2012
# rMBP). The config-space port-routing write (arch/x86_64/pci.rs::enable_intel_xhci_ports) runs by
# default with mask-read-before-write discipline, applied before enumeration. This `noportsw` OPT-OUT
# feature (UNAOS_NOPORTSW=1) SUPPRESSES the flip for the never-run no-routing topology experiment =>
# zero register writes => byte-identical no-routing media. x86_64 only (the gated call site is
# x86-only; aarch64 media are byte-identical). Inert on QEMU (non-Intel xHCI).
noportsw = []
# EHCI-1 scout: UNAOS_EHCISCOUT=1 arms a STRICTLY READ-ONLY EHCI reconnaissance probe (PCI-config +
# MMIO reads only — zero writes to any register/port) that dumps the EHCI companion controllers'
# capability/operational/PORTSC state at boot, so an EHCI driver arc can be planned against real
# register evidence (the 2012 rMBP internal kbd/trackpad are on EHCI-only ports). x86_64-only module;
# default OFF => module unlinked, media byte-identical. Enable via `UNAOS_EHCISCOUT=1`.
ehciscout = []
# EHCI-4 M1 decouple: `ehciscout`/`ehciconfig` are now COMPILE features (the scout module + shared
# wake are built by default, because the default-ON EHCI-3 driver depends on them). These `*_run`
# features gate only the diagnostic CALL SITES (pci.rs) so a default boot builds the module but runs
# NEITHER the read-only census NOR the configure-and-relook evidence — only the driver. UNAOS_EHCISCOUT
# =1 / UNAOS_EHCICONFIG=1 arm the probes; pair with UNAOS_NOEHCIHID=1 for probe-without-driver.
ehciscout_run = ["ehciscout"]
ehciconfig_run = ["ehciconfig"]
# EHCI-2 configure-and-relook scout: UNAOS_EHCICONFIG=1 arms a knob-gated, minimal EHCI WAKE sequence
# (PMCSR->D0, USBLEGSUP OS-ownership handshake, RS=1, then CONFIGFLAG=1 + port-power) with two PORTSC
# censuses (before/after CONFIGFLAG=1) so the attended rMBP sitting can distinguish
# asleep-until-configured USB internals from not-USB (SPI). Writes are confined to the EHCI functions'
# PMCSR / USBLEGSUP OS-own bit / USBLEGCTLSTS (SMI-enable clear + status ack after OS ownership) /
# USBCMD.RS / CONFIGFLAG / PORTSC port-power bits — NO enumeration, NO
# transfers, NO driver, and nothing touching xHCI routing. Implies `ehciscout`; default OFF => the
# config path is unlinked and the module is byte-identical to the EHCI-1 read-only scout.
ehciconfig = ["ehciscout"]
# EHCI-3 driver: UNAOS_EHCIHID=1 arms the minimal EHCI HID driver — the shared EHCI-2 wake, port
# reset, synchronous EP0 enumeration with the M1 topology-fork witness (RMH hub tier vs direct
# device), periodic interrupt-IN QHs, and boot keyboard/mouse reports decoded to pal::Events in a
# main-loop poll (no interrupts). For the 2012 rMBP internal keyboard/trackpad on the
# non-switchable EHCI-only ports; runs permanently alongside xHCI (disjoint ports, PORTSW-1 §7f),
# never touching an xHCI register. Implies `ehciconfig` (the wake layer it builds on).
# EHCI-4 M1 (2026-07-17): now DEFAULT-ON on x86 — the internal keyboard is metal-proven to TYPE
# (usb_xhci.md §10 metal verdict). The plumbing (arroyo/builder) pushes `ehcihid` by default and
# suppresses it under UNAOS_NOEHCIHID=1 (the PORTSW-1 negative-knob policy). Opt-out => this feature
# is not enabled => module + every call site unlinked => byte-identical to the pre-fold no-EHCI media.
ehcihid = ["ehciconfig"]
# SMOLNET-DEFAULT (2026-07-17): the mature smoltcp TCP/IP stack (ROADMAP §1b) is the DEFAULT x86 net
# path — the shell's ping/arp/netinfo, the socket syscall family (SOCK-2..7), the DNS sinkhole
# (zeolite), and the boot witnesses. Pulls in the x86-only smoltcp optional dependency and compiles
# the `smolnet` Device adapter over the e1000e rings (the module is additionally
# target_arch="x86_64"-gated, so aarch64 never pulls smoltcp and its binaries are byte-identical
# whether or not the feature is pushed). This POSITIVE feature is pushed BY DEFAULT by arroyo/builder;
# UNAOS_NOSMOLNET=1 opts out (the feature is not pushed) => the hand-rolled `net` crate is the whole
# net path, byte-identical to the pre-flip default. The hand-rolled stack stays compiled and live
# regardless (it still owns connect/fetch/udpsend, the TCP echo listener, and driver DHCP). Poll-driven,
# static buffers (no heap growth). See unaos/docs/dev/OS/08_NET/networking.md.
smolnet = ["dep:smoltcp"]
# Jetson Orin Nano (Tegra234) build: point the aarch64 serial at the Tegra UART — a 16550-style
# controller at a Tegra MMIO base (NOT the QEMU `virt` PL011) — so the board has a real serial
# console from boot #1 over the carrier's button-header USB-TTL (115200 8N1). Mutually exclusive
# with `pi`. Enable via `UNAOS_TEGRA=1`. See arch/aarch64/serial.rs for the base address (TO VERIFY
# on the board) and register layout.
tegra = []

# ORIN-SMP-2: the `UNAOS_SMPPROBE=<n>` JM5 `CPU_ON` firmware-wall INVESTIGATION probe
# (arch/aarch64/smpprobe.rs), wired into `tegra_early_stop` after JM4. Tegra-only at runtime; with
# this feature OFF (default) the whole module + call site vanish and the tegra image is
# byte-identical to baseline. WHICH experiment runs is `option_env!("UNAOS_SMPPROBE")` (compile-time
# const). Enable via `UNAOS_SMPPROBE=<n> UNAOS_TEGRA=1 ./arroyo esp-jetson`.
smpprobe = []

# ORIN-SMP-DEFAULT: the real 6-core Orin SMP kick-off (arch/aarch64 smp_virt.rs
# `start_secondaries_tegra` + the fdt_tegra `/cpus` presence enumerator), wired into
# `tegra_early_stop` after JM4 and BEFORE the JM6 drop. Tegra-only. As of ORIN-SMP-DEFAULT this
# feature is DEFAULT-ON for tegra builds (the build scripts push it for any tegra image unless
# UNAOS_NOTEGRASMP=1 opts out) — metal-proven across SMP-1..8. With the feature OFF (UNAOS_NOTEGRASMP=1)
# the kick-off + its `/cpus` enumerator vanish and the tegra image runs workers on the boot core only,
# byte-identical to the pre-flip baseline (build twice, compare hashes). The DTB `/cpus` node is the
# ONLY presence oracle (RIDER 1). See arch_arm64.md §ORIN-SMP.
tegrasmp = ["tegra"]

# JETSON-XCARVE M2: the `UNAOS_XCARVE=1` inherited-xHCI-pointer instrumentation
# (arch/aarch64/xusb_tegra.rs::jbxc_inherited_dump), fired at the top of `jb2b_attach` BEFORE the
# no-HCRST takeover overwrites the controller's inherited DCBAAP/CRCR/ERST — so it snapshots the
# firmware-left DCBAA + per-slot device-context pointers, scratchpad array, ERST entries, and
# CRCR/ERDP the takeover DMA rides. Diagnostic for the xHCI-takeover carveout wall (fixed fault ADDR
# 0x800000027767dc80 at JB9i eviction). Tegra-only at runtime; with this feature OFF (default) the
# probe + its call site vanish and the tegra image is byte-identical to baseline (build twice,
# compare hashes; zero `JBXC` strings knob-off). Enable via `UNAOS_XCARVE=1 UNAOS_TEGRA=1 ./arroyo
# esp-jetson`. See arch_arm64.md §JETSON-XCARVE and scripts/orin-xcarve-bench.md.
xcarve = ["tegra"]

# JETSON-XCARVE FIX M2: the `UNAOS_XCARVE_SCRUB=1` aimed neutralization
# (arch/aarch64/xusb_tegra.rs::jbxc_scrub_inherited), fired at the top of `jb2b_attach` just after
# the census, BEFORE the no-HCRST takeover and BEFORE JB9i's DISABLE_SLOT drain. It walks the same
# inherited DRAM structures the census walks (firmware DCBAA, scratchpad array, endpoint-context TR
# dequeue pointers) and rewrites ONLY the values that fail the plausibility test — bit-63 set, or
# outside the DRAM window [0x8000_0000, 0x2_8000_0000) — so the carveout wall (fault ADDR
# 0x800000027767dc80 at JB9i) has no poisoned pointer to ride. Never rewrites a sane pointer; never
# touches the Falcon (no HCRST, no CSB). If nothing is poisoned it is a no-op (which discriminates
# the controller-internal ambiguity bucket). Tegra-only at runtime; with this feature OFF (default)
# the scrub + its call site vanish and the tegra image is byte-identical to baseline (zero
# `JBXC-SCRUB` strings). Enable via `UNAOS_XCARVE_SCRUB=1 UNAOS_TEGRA=1 ./arroyo esp-jetson`
# (combine with `UNAOS_XCARVE=1` to see the census + scrub together). See arch_arm64.md
# §JETSON-XCARVE and scripts/orin-xcarve-bench.md.
xcarve_scrub = ["tegra"]

# JETSON-XCARVE-CRCR M1: the `UNAOS_XCARVE_CRCRQ=1` command-ring quiesce + re-seat
# (arch/aarch64/xusb_tegra.rs::jbxc_crcrq_quiesce), fired in `jb2b_attach` AFTER the no-HCRST
# takeover programs the rings and start()s the controller, but BEFORE JB9i's DISABLE_SLOT drain —
# i.e. provably before the FIRST command doorbell. The elimination verdict put the carveout wall's
# FillWrite target (fault ADDR 0x800000027767dc80/dc40 at JB9i) in the controller-internal command
# ring: per xHCI 5.4.5 the CRCR pointer field is only loaded when CRR=0, so if the takeover
# inherited a RUNNING command ring (CRR=1) init_pointers' CRCR write was silently dropped and the
# controller kept the firmware's poisoned internal fetch pointer. This lever reads CRCR.CRR; if 1,
# issues a spec-clean Command Abort (CRCR.CA, xHCI 4.6.1.2) and polls CRR->0; then (either way)
# re-programs CRCR with OUR ring pointer + RCS so no command is ever issued on an un-re-seated ring.
# CA is a command-ring control op ONLY — never HCRST, never CSB, the Falcon service loop is
# untouched (Falcon-safety invariant). Every step prints under a stable `JBXC-CRCRQ:` prefix.
# Tegra-only at runtime; with this feature OFF (default) the quiesce + its call site vanish and the
# tegra image is byte-identical to baseline (zero `JBXC-CRCRQ` strings). Enable via
# `UNAOS_XCARVE_CRCRQ=1 UNAOS_TEGRA=1 ./arroyo esp-jetson` (combine with `UNAOS_XCARVE=1` to see the
# census + quiesce together). See arch_arm64.md §JETSON-XCARVE and scripts/orin-xcarve-bench.md.
xcarve_crcrq = ["tegra"]

# JETSON-XCARVE M1: the `UNAOS_XCARVE_RELINK=1` relink-experiment pad — a `#[used]` read-only pad
# static (arch/aarch64/xusb_tegra.rs) that trivially perturbs the image's section/symbol layout and
# load extent with ZERO semantic change (the pad is never read). Rebuilding the layout-correlated
# leg-23 image with this on tests whether the carveout fault vanishes/moves — proving (or refuting)
# the layout correlation. With this feature OFF (default) the pad vanishes and the tegra image is
# byte-identical to baseline. Enable via `UNAOS_XCARVE_RELINK=1 UNAOS_TEGRA=1 ./arroyo esp-jetson`.
xcarve_relink = ["tegra"]

# ORIN-NET-1: the `UNAOS_PCIEPROBE=1` read-only PCIe root-complex + NIC recon census
# (arch/aarch64/pcie_probe.rs), wired into `tegra_early_stop` (the metal Orin census) AND the virt
# GICv3 path (so `UNAOS_PCIEPROBE=1 UNAOS_GICV3=1 ./arroyo test-arm 40` witnesses the graceful skip
# against the QEMU virt DTB, which has a generic ecam but no Tegra234 RC). Standalone (does NOT imply
# `tegra`, mirroring the `smpprobe` pattern) so the census can run on BOTH the tegra and the virt
# builds; the metal build combines it with `UNAOS_TEGRA=1`. Read-only: DTB census + a
# poison-rejecting, already-mapped-only config-space liveness read; no fabric/config/BAR/power write,
# no new page-table mapping (STOP tripwire). With this feature OFF (default) the module + both call
# sites vanish and every image (tegra AND virt) is byte-identical to baseline. See arch_arm64.md
# §ORIN-NET-1 and scripts/orin-net1-bench.md.
pcieprobe = []

# ORIN-NET-2: the `UNAOS_PCIE2=1` controller-0 link + device-enumeration recon
# (arch/aarch64/pcie_probe.rs, `census2`). Extends ORIN-NET-1's census with the last recon step before
# a real driver arc: it reads controller-0's LINK STATE from the root port's DBI config space (the
# PCIe-capability Link Status register — read-only, always valid regardless of link state, unlike the
# downstream config window NET-1 read which returns all-Fs when the link is down) and, via the EXISTING
# kernel MMIO-mapping path (`mmu_tegra::map_mmio_window`, kernel page tables only), reaches the
# config/ECAM aperture for a bus-0/bus-1 walk. Standalone (does NOT imply `tegra`, mirroring
# `pcieprobe`) so the recon runs on BOTH the metal tegra build (combine with `UNAOS_TEGRA=1`) and the
# virt witness build (graceful skip — no Tegra234 RC). Read-only beyond kernel page tables: no
# fabric/config/BAR write, no link retrain, no BAR sizing; the ONLY writes are Device-nGnRE page-table
# mappings. OFF (default) => module + both call sites vanish, byte-identical to baseline. See
# arch_arm64.md §ORIN-NET-2 and scripts/orin-net2-bench.md.
pcie2 = []

# ORIN-NET-3: the `UNAOS_PCIE3=1` PS-widen + controller-0 link bring-up + device enumeration recon
# (arch/aarch64/pcie_probe.rs `census2` pcie3 blocks + mmu_tegra PS widen). This is the lane's FIRST
# DELIBERATE FABRIC WRITE arc, in exactly three write classes: (M1) widen the tegra regime's TCR
# PS/IPS 36->40-bit so `map_mmio_window` can reach controller-0's ECAM (`0x2e_2000_0000`, ~184 GiB,
# above the NET-2 36-bit / 64 GiB ceiling); (M2) the appl LTSSM enable sequence on controller 0 ONLY
# (Linux pcie-tegra194 = the sequence's documentation of record), polling DLL-active with a finite
# backstop; (M3) the all-ones/readback BAR-sizing ritual on the enumerated device's BARs, restoring
# each original immediately. Every fabric write is logged loudly before issue. Builds on the `pcie2`
# machinery (implies it); the metal M2/M3 writes are additionally `tegra`-gated, so a `pcie3`-standalone
# virt build performs no MMIO and only witnesses the PS-widen mapping decision + graceful skip. OFF
# (default) => the module blocks + call sites vanish, byte-identical to baseline modulo the ratified
# 1-byte Location class. See arch_arm64.md §ORIN-NET-3 and scripts/orin-net3-bench.md.
pcie3 = ["pcie2"]

# ORIN-NET-4: the `UNAOS_NET4=1` Realtek RTL8168/8111 GbE driver + smoltcp bind — the Orin's FIRST
# network path (arch/aarch64/rtl8168_tegra.rs). Builds on NET-3's PS-widen + link bring-up + ECAM
# enumeration (implies `pcie3`): claims controller-0's downstream device (bus1:dev0:fn0 = Realtek
# 0x10ec:0x8168, the metal-identified NIC), maps its register BAR via the established PS-widened
# `map_mmio_window` path, resets the MAC, brings up the C+ command/descriptor RX/TX rings (datasheet
# programming model), reads the station MAC, and binds a `smoltcp::phy::Device` over the rings
# (the x86 e1000/smolnet seam, transposed to aarch64/tegra). Pulls the smoltcp dep on aarch64 (added
# to the aarch64 target deps as optional). The driver's MMIO/DMA + the smoltcp adapter are additionally
# `tegra`-gated (QEMU models no Tegra234 RC), so a `net4`-standalone virt build performs no MMIO and
# only prints one honest witness line; the metal build combines `UNAOS_NET4=1 UNAOS_TEGRA=1`. Every
# config/fabric write (command-register MEM+BME decode-enable, then the reset/ring register program)
# is logged before issue. Default OFF => the module + call sites vanish and the smoltcp dep is not
# pulled, byte-identical to baseline. See arch_arm64.md §ORIN-NET-4 and scripts/orin-net4-bench.md.
net4 = ["pcie3", "dep:smoltcp"]

# AARCH64-VNET: the `UNAOS_VNET=1` virtio-net-mmio driver on the QEMU `virt` machine + smoltcp bind
# (arch/aarch64/virtio_net.rs) — the QEMU-testable proof of the aarch64 smoltcp seam NET-4 built. NET-4's
# driver is `tegra`-gated (QEMU models no Tegra234 RC), so it is only ever COMPILE-tested off metal; this
# arc exercises the IDENTICAL seam shape (ring → `smoltcp::phy::Device` → `Interface` → ICMP echo) against
# a `virtio-net-device` QEMU DOES model, driven end-to-end with real packets over QEMU user-mode
# networking (slirp). Scans the fixed virtio-mmio window (`0x0a00_0000`), drives the LEGACY transport
# (QEMU's default), negotiates a minimal feature set (F_MAC only), sets up the RX/TX virtqueues, and runs
# a bounded ICMP-ping witness to the slirp gateway (`10.0.2.2`) that emits a self-checking PASS/FAIL line.
# Pulls the smoltcp dep on aarch64 (same optional dep NET-4 uses). Default OFF => the module + call site
# vanish and the smoltcp dep is not pulled, byte-identical to baseline. Run with
# `UNAOS_VNET=1 UNAOS_GICV3=1 ./arroyo test-arm`. See arch_arm64.md §AARCH64-VNET.
vnet = ["dep:smoltcp"]

# CORE3-PROBE: instrument the aarch64 secondary-core entry stub (`_secondary_start`) to raw-dump,
# MMU-off / no-stack, each core's MPIDR_EL1 low byte, CurrentEL, and its arrival x0 to the Pi 4 PL011
# (0xFE201000) BEFORE any Rust runs. Disambiguates the CORE3-SMP >1 MiB core-3 regression (firmware
# delivery vs MPIDR-reads-0 vs wrong entry) on an attended Pi bench. aarch64/`pi` only — the probe
# asm is emitted only in the Pi secondary stub; x86 and the QEMU `virt` path are untouched. Default
# OFF => the secondary stub is byte-identical. Enable via `UNAOS_CORE3PROBE=1 UNAOS_PI=1 ./arroyo
# kernel8`. See unaos/scripts/core3-probe-bench.md and docs .../arch_arm64.md §CORE3-SMP.
core3probe = ["pi"]

# PI-V3D-1: the VideoCore VI (V3D 4.2) GPU foundation (arch/aarch64/v3d.rs) — firmware power/clock,
# MMIO probe, the V3D-private MMU, and a minimal GPU buffer-clear, wired into the Pi bare-metal BSP
# bring-up after emmc2::probe. Implies `baremetal` (which implies `pi`) — the whole chain is Pi-4
# specific. With this feature OFF (default) the module + its call site vanish and the kernel8 image
# is byte-identical to baseline (build twice, compare hashes). QEMU raspi4b does not model V3D: the
# probe detects absence and degrades gracefully. Enable via `UNAOS_V3D=1 UNAOS_PI=1 ./arroyo
# kernel8`. See arch_arm64.md §PI-V3D and scripts/pi-v3d-bench.md.
v3d = ["baremetal"]

# PI-USB-1: the BCM2711 PCIe root complex + VL805 xHCI attach (arch/aarch64/piusb.rs) — brcmstb RC
# bridge reset / link-up / MEM-window + inbound-BAR config, VL805 (1106:3483) enumeration + BAR sizing,
# the NOTIFY_XHCI_RESET mailbox, and the polled shared-xHCI attach to the "controller halted-but-decoding
# + ports powered" honesty line. The VL805 owns ALL four Pi USB-A ports, so this is the unlock for every
# Pi USB device. Implies `baremetal` (which implies `pi`) — the whole chain is BCM2711-specific. With
# this feature OFF (default) the module + its call site vanish and the kernel8 image is byte-identical to
# baseline (build twice, compare hashes). QEMU raspi4b does NOT model the PCIe RC: the bring-up detects
# absence and degrades gracefully; positive verification is attended metal. Enable via `UNAOS_PIUSB=1
# UNAOS_PI=1 ./arroyo kernel8`. See arch_arm64.md §PI-USB and scripts/pi-usb1-bench.md.
piusb = ["baremetal"]

# NS-SPAN (K7 WATCH rider): instrument the IRQ-masked namespace-lock hold at the three fused K6/K3/K5
# persist sites (`sys_fgrant_revoke_2phase`, `native_persist_grants`, `native_persist_grow`) — read
# CNTPCT at ns-take and ns-release, track the per-site WORST-CASE hold in ticks, and emit ONE serial line
# (`:: NS-SPAN: worst revoke=… grants=… grow=… ticks (freq …) ::`) after the K3/K5 fixtures run. Closes
# the Option-A deeper-masked-span bench WATCH with a metal number. No locks / no heap in the measurement
# path (an RAII probe reading CNTPCT + an `AtomicU64::fetch_max`). Default OFF => byte-identical (the whole
# rider is `#[cfg(feature = "nsspan")]`-gated; the core3probe idiom). Enable via `UNAOS_NSSPAN=1 ./arroyo
# kernel8`. aarch64 only.
nsspan = []

# BATMON-1: the Apple SMC battery monitor (UNAOS_SMC=1). Arms the polled SMC key/value driver
# (drivers/smc.rs) — an M1 boot scout that dumps the SMC key inventory over serial (so the first
# attended 2012 rMBP sitting yields the real battery-key list) plus the M2 battery snapshot feeding
# the on-screen meter. Port I/O confined to 0x300 (data) / 0x304 (command) with bounded handshakes;
# no value-mutating WRITE_CMD. QEMU's isa-applesmc (attached by the builder under this knob) gates
# the protocol machinery via a known-key read; battery keys are metal-first by construction.
# x86_64-only module; default OFF => the module + every call site are unlinked and the media is
# byte-identical. See unaos/docs/dev/OS/09_PLATFORM/smc_battery.md.
smc = []

# RAST-1 / RAST-TEGRA: the `rast` software-rasterizer demo (UNAOS_RAST=1). Pulls in the
# platform-neutral `rast` crate and links the knob-gated spinning-cube demo (rast_demo.rs), presented
# through the existing panel `Screen` path (call-never-edit). The `rast` crate is no_std and arch-
# neutral, so both the dep and the module are `rast`-feature-gated but NOT arch-gated: x86/virt
# (RAST-1), aarch64/virt (QEMU panel witness), and aarch64/tegra (RAST-TEGRA, the Orin panel) share
# one code path. Knob-off builds unlink the dep + module, so media stay byte-identical on BOTH arches.
# See docs/dev/OS/08_VIDEO/rasterizer.md.
rast = ["dep:rast"]

# INSTALL-CORE: the `UNAOS_INSTALLDEMO=1` storage-agnostic installer engine + its boot witness
# (crates/kernel/src/install/). Arms a GPT writer + FAT32 formatter + extent content-verify against a
# dedicated BLANK scratch disk the builder attaches over the usb-storage slot (the boot ESP is a
# separate ide-hd, never touched). The engine is arch-neutral — it drives only `drivers::block` — so
# it COMPILES on both arches under this feature (its pub API raises no dead-code warning on aarch64);
# the witness `install::run_demo` call site is x86_64-only (the QEMU scratch disk is x86 this arc).
# The engine refuses to write unless the target's leading sectors are blank (never-touch-a-seated-card
# discipline). Default OFF => the module + call site vanish and every image is byte-identical to
# baseline. See docs/dev/OS/10_INSTALL/installer_engine.md.
installdemo = []

[dependencies]
# FIX: Use 'spin_no_std' to explicitly disable Standard Library usage
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }

# HARDWARE
spin = "0.12.1"
volatile = "0.6.1"
linked_list_allocator = "0.10.6"
font8x8 = { version = "0.3.1", default-features = false }
cfg-if = "1.0.0"
unaos-boot-info = { path = "../boot-info" }
net = { path = "../net" }
fdt = "0.1.5"
# RAST-1 / RAST-TEGRA: platform-neutral (no_std, arch-agnostic) software rasterizer. `optional` so
# knob-off builds on BOTH arches never compile it (byte-identical). Lives in the shared [dependencies]
# (not an arch-gated block) because the demo now targets x86/virt AND aarch64/virt AND aarch64/tegra.
rast = { path = "../rast", optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# BeFS-K3: the native UnaFS filesystem, no_std core only (on-disk types, codec,
# BlockDevice/SectorDevice adapter seam). The default `std` feature would pull
# host-native backends (FileDevice/mmap/bandy/query) — never enable it here.
# aarch64-only (K3-N1): only the Pi media carries a unafs partition; keeping it
# out of the x86 kernel protects the tight usbdebug-esp size band.
unafs = { path = "../../libs/fs/unafs", default-features = false }
# ORIN-NET-4: the mature TCP/IP stack for the aarch64/tegra NIC bind — the same crate/version/feature
# set the x86 `smolnet` uses, declared here (aarch64) as optional so it is pulled ONLY under the
# `net4` feature (via `dep:smoltcp`). Default-OFF net4 => not compiled => aarch64 media byte-identical.
smoltcp = { version = "=0.13.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-icmp", "socket-udp", "socket-tcp", "socket-dhcpv4"], optional = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.4"
uart_16550 = "0.6.0"
# SOCK-1: mature TCP/IP stack (0BSD, #![no_std], heap-optional). x86-only + optional so aarch64 and
# knob-off x86 builds never compile it. default-features off; only the three features SOCK-1 uses:
#   medium-ethernet — the e1000e is an Ethernet L2 device (built-in ARP neighbor discovery)
#   proto-ipv4      — IPv4 addressing/routing/checksums for the 10.0.2.0/24 slirp net
#   socket-icmp     — the ICMP echo socket that `ping`/the boot witness drive
#   socket-udp      — SOCK-2: the UDP sockets behind the sys_socket/bind/sendto/recvfrom family
#   socket-tcp      — SOCK-3: the TCP client sockets behind sys_connect/sys_send/sys_recv
smoltcp = { version = "=0.13.1", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-icmp", "socket-udp", "socket-tcp", "socket-dhcpv4"], optional = true }
