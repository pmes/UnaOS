[package]
name = "unaos-kernel"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = []
# R0 / rtwit: the WORST-CASE RULER. Arms the `[rtwit]` tail instruments (input→present latency,
# per-lock max hold, max interrupt-mask span) — MAXes only, never a mean. Pure measurement: no
# scheduling/locking/present behaviour changes. DEFAULT OFF => every hook degrades to an empty inline
# shim and a zero-sized `HoldTimer`, so the boot is byte-inert on the hot path (see `src/rtwit.rs`).
# x86_64-only in effect (the real impl is gated on `target_arch = "x86_64"`; the shim covers aarch64).
# Enable via `UNAOS_RTWIT=1`. Kept in sync with arroyo.
rtwit = []
# R1 / rtpi: PRIORITY INHERITANCE on the x86 sleeping `Mutex` (arch::x86_64::sched), plus its
# `[rtpi]` witness (donation events, max priority jump, transitive-chain depth, live leak gauge).
# Unlike `rtwit` (a pure ruler), this CHANGES scheduling behaviour: while a strictly-higher task
# blocks on a `Mutex`, the holder inherits the blocker's priority (transitively) until release, so
# mid-priority tasks cannot preempt the critical section (bounded priority inversion). DEFAULT OFF
# => the `Task`/`Mutex` PI fields do not exist, `Mutex::lock` takes its original single-`wait()`
# path, and every witness hook is an empty inline shim — so the boot is BYTE-IDENTICAL to the
# pre-arc scheduler (see `src/rtpi.rs` and the PI block in `arch/x86_64/sched.rs`). x86_64-only in
# effect. Enable via `UNAOS_RTPI=1`. Kept in sync with arroyo AND builder/src/main.rs.
rtpi = []
# Cleanroom GPU driver features
nvidia-kepler = []
nvidia-kepler-takeover = []
nvidia-kepler-fifo = []
nvidia-kepler-kdisp-hold = []
# CE-LADDER: `UNAOS_KEPLER_CE=1` — read-only copy-engine reconnaissance on the GK107
# (drivers/gpu/kepler_ce.rs), run from `kepler::init` BEFORE the fifo leg so it sits above
# every FECS access and sees the runlist array pre-submit. Rungs R1 (PTOP device-info
# sweep), R2 (CE PRI window probe), R3 (wide runlist scan), R5 (firmware instance-block walk
# through PRAMIN). No device writes except the PRAMIN window base, which is metal-proven
# (Boot A `bar1-identity`) and restored at every use. Implies `nvidia-kepler` so the module's
# gate in gpu/mod.rs is self-sufficient; independent of `nvidia-kepler-fifo` on purpose — a
# boot may run the reconnaissance without building a channel. DEFAULT OFF => module and call
# site unlinked, media byte-identical. Kept in sync with arroyo AND builder/src/main.rs.
nvidia-kepler-ce = ["nvidia-kepler"]
# WC-X86: bring the window compositor (`video::wm`) up on the x86 panel path. Compiles
# `video/wcx.rs` — the activation seam and the one kernel-drawn demo window — plus fbcon's
# CONSOLE-WINDOW route (`panel_console_window_open`: the kernel console becomes an ordinary row in
# the window table and its glyphs go to a cached-RAM surface the compositor presents), and its single
# call site at the end of `kepler_display::takeover_display`. Panic output is exempt by law: a panic
# tears the route down and paints the panel directly, `wc` or not. Nothing in
# `wm`/`cursor` changes; this feature only *activates* what is already arch-neutral there.
# x86_64-only module. DEFAULT OFF => module + call site vanish and every artifact (x86 and aarch64)
# is byte-identical. Enable via `UNAOS_WC=1` (needs UNAOS_KEPLER + UNAOS_KEPLER_TAKEOVER to reach
# the seam).
wc = []
# VSYNC-PACE r3: `UNAOS_VSYNCPACE=1` — the OPT-IN that ARMS the kernel-side present pacer.
#
# ⚠ THE POLARITY IS INVERTED FROM GR22's, DELIBERATELY, AND THIS COMMENT KEEPS THE OLD ARGUMENT SO THE
# CHANGE IS LEGIBLE. The feature used to be `nopace` and the pacer was DEFAULT ON, justified by: "a
# desktop that renders frames the panel cannot scan out is burning CPU for pixels no operator can see,
# so waste-free is the right default and an opt-in knob would leave the shipped configuration the
# wasteful one."
#
# That argument decides a question the OS is not entitled to decide FOR the program. P, GR25: *"fps is
# made up/forced to run a certain speed rather than running unrestricted as does the load across
# cores."* A present is a ring-3 program asking the machine to do work; the machine's answer is how
# long the work takes, not a sleep chosen on the program's behalf. Boot B is the proof that the old
# default was answering by fiat: `[wpace] win=3 pres=311 paced=311 slept=4615ms rate=62.1/s` — EVERY
# present delayed, 4.6 s of a 5 s span spent asleep inside the syscall, and 62.1/s reported as though
# it were the program's speed when it was the pacer's ceiling.
#
# So: DEFAULT OFF. A present returns as soon as its composite is done, at whatever rate the program can
# reach, and the load shows up across cores where an operator can see it. See `arch/x86_64/syscall.rs`
# (`present_pace`) and `docs/dev/OS/08_VIDEO/engine.md` "VSYNC-PACE r3" for why NEITHER a drop nor an
# EWOULDBLOCK-style refusal replaced the sleep, and for the per-window opt-in ABI this build-level knob
# stands in for until it exists.
#
# What arming it is FOR, unchanged from the old hatch's inverse: the pacer answers "what does this
# fleet look like clamped to the panel" by fiat, and a boot that wants THAT question answered — a
# vsync-cadence comparison, a power measurement — arms it explicitly. `[wpace] mode=` names which
# regime any given capture was taken under, so the two are never confused again.
#
# `vsyncpace` is x86-only in effect (everything it gates lives in `arch/x86_64/syscall.rs`, and `wc` is
# an x86 feature) and is STRIPPED from aarch64 builds by `arroyo`'s `arm_features`, so Pi and Jetson
# media stay byte-identical whichever way it points.
vsyncpace = []
# INSTGUI: the graphical installer window (UNAOS_INSTGUI=1; requires wc + the x86 engine).
instgui = ["wc", "installdemo"]
intel-ivb = []
unaos_ivb = ["unaos-boot-info/unaos_ivb"]
# GEN7-3D R1: the Ivy Bridge render-engine reconnaissance rung (`UNAOS_IVB3D=1`, mapped in
# `arroyo` and `builder/src/main.rs` — all three legs, per the knob-wiring law). Implies
# `intel-ivb` because the rung consumes the BAR0 window `igpu::init` maps and publishes.
#
# READ-ONLY: the rung performs zero MMIO writes and zero config writes, so unlike `gmux_igd`
# the media is NOT single-use and no boot from an armed stick changes machine state. It
# cannot black the panel — it writes nothing, and the panel belongs to the Kepler anyway.
#
# DEFAULT OFF => `drivers/gpu/gen7.rs` is not compiled, the call site in `igpu::init`
# vanishes, and no `:: gen7:` token exists in the image (strings-verifiable, which is the
# gate that matters here — QEMU has no Ivy Bridge IGD and proves nothing about any rung).
# See ~/unaos-bench/scratch/gr25/GEN7-3D-draft.md §5 rungs R0/R1.
gen7 = ["intel-ivb"]
# GMUX-IGD: arm the display-mux switch to the INTEGRATED GPU (`UNAOS_GMUX_IGD=1`, already mapped in
# `arroyo` and `builder/src/main.rs` since ce5c6f49 — this entry is the third leg those two assumed
# existed). x86_64-only, and only reachable on an `unaos_ivb` build that printed PROTOCOL PROVEN.
# DEFAULT OFF => every port-writing helper, `RevertState`, and the arm block in `igpu::init()` vanish
# and `read_gmux_trace()` is left exactly as trunk has it (inline closures, hard iteration cap, no
# `arch::ms()`), so the disarmed build is behaviourally identical to baseline. See
# docs/dev/GEMINI/video/iGUI/PROPOSAL-igpu-gmux-igd.md and RUNBOOK-gmux-igd.md — the media is
# SINGLE-USE, every boot from an armed stick switches the mux again.
gmux_igd = []
# DEFAULT-QUIET (witness): gate the battery of EL0/kernel fixtures that RE-PROVE long-metal-confirmed
# facts on every boot (x86: nmi-self-fire + canonical-guard + U1a/U1b/U2-0a/U3/U3.5 + the
# U2/U4x/U5x/U6x/U6bx storage chain that cascades U7x..U6gx; aarch64 baremetal: the M6b/M6e/M6d/M6f/M6g
# + U4..U7 chain that cascades U9/U10/U10c/U10d/U11/U11-defer/U11-reap + the K*/F2/F3/BANDY/unafs
# selftests). DEFAULT OFF => those call sites vanish and a default boot reaches the shell with the
# boot-honesty lines only (device/link/calibration/MISSION/CAPSTONE). The regression BATTERIES arm it
# (arroyo/builder push `witness` for `test`/`test-fat`/`test-arm`/`kernel8-test` via UNAOS_WITNESS=1)
# so witness coverage is unchanged-green; the boot/media builds (`x86`/`arm`/`esp-*`/`kernel8`) leave it
# off. Gates CALL SITES only — never the fixture bodies. See review/unaos-default-quiet-LANDING.md.
witness = []
# SELFHOST-2 (`UNAOS_SELFHOST=1`): the source tree is READABLE ON THE SHARD — `crate::selfhost` mounts
# the program-source volume, verifies SRC.TGZ against the sha256 in SRC.SHA, then gunzips + tar-walks
# it and enumerates the members (streaming both ends; strictly read-only, no write path to media).
# Rung 2 of the self-hosting line begun by SOURCE-ALONG (docs/dev/OS/10_INSTALL/source_along.md).
# Arch-neutral (drives only `fs::fat` + `crate::hash`), so it compiles on both arches; the witness
# call site is x86_64-only this arc because the packaged fixture is the x86 usb-storage image
# (`./arroyo test-selfhost`). Also pulls in `crate::hash`. DEFAULT OFF => the module, `crate::hash`
# (absent the installer features) and the call site all vanish, and every image is byte-identical to
# baseline. Kept in sync with arroyo AND builder/src/main.rs.
selfhost = []
# WXN-x86 M3b (THE ARM): PERFORM the W-clear on the kernel's executable pages, rather than only
# measuring it. x86_64 only. DEFAULT OFF is load-bearing and not a convenience: with the knob off,
# `memory::wxn_ro_stage` runs the identical extent derivation and the identical read-only census,
# prints `:: WXN-M3B-PRE: ... -> CENSUS ::` and then `would=` where an armed boot prints `cleared=`,
# and writes NOTHING — it does not even open a `CR0.WP` window. The store itself is gated with
# `cfg!(feature = ...)`, NOT `#[cfg]`, so it is COMPILED and type-checked in every leg of
# `./arroyo check` whichever way the knob is set (GR19 paid for that lesson with a gate blind to
# mixed knobs), and the `x86-all` cfg-matrix leg carries `wxnro` so the ARMED polarity is
# type-checked too. Enable via `UNAOS_WXNRO=1` — in BOTH arroyo and builder, since the x86 ESP
# carries the BUILDER's kernel. See arch/x86_64/memory.rs §WXN-x86 M3b and docs/SECURITY.md.
wxnro = []
# WC-G/M3 (PAYGO): reshape the `witness` build's `[wc-g]` glass battery so a boot does not pay for
# all four passes at once. x86_64 only, and it changes only the READ-BACK: pass 1 becomes
# lattice-sampled (every 16th source pixel per row, phase rotating one column per row) and marks
# itself `coverage=lattice16` on the wire; passes 2..4 stay FULL coverage but are deferred until 15 s
# of uptime, so the battery completes on a live desktop instead of inside the boot burst. The four
# checksum legs are untouched and every FORBID stays armed the whole boot. A deferred pass does not
# spend budget and never goes quiet — it prints `[wc-g] paygo … -> DEFERRED` and keeps an unbudgeted
# `deferred=` census. Requires `witness` (the module is `#[cfg(feature = "witness")]`); DEFAULT OFF =>
# every `[wc-g]` line is byte-identical to the pre-M3 wire and aarch64 is unaffected either way.
# Enable via `UNAOS_WCG_PAYGO=1`. See video/wcg.rs §WC-G/M3.
wcg-paygo = []
# Skip xHCI/USB bring-up entirely (`pci::init`). For real-hardware video bring-up where the
# firmware/SMM may still own the xHCI controller (this branch has no BIOS->OS handoff) and wedge
# its reset handshake — the controller's status bits never flip, so the bounded-but-slow timeout
# loops stall boot for many seconds before the GUI paints. With this feature the GUI comes up
# immediately; USB is simply absent (no keyboard). Enable via `UNAOS_SKIP_XHCI=1 ./arroyo ...`.
skip_xhci = []
# Hold the fbcon boot log on screen instead of handing the framebuffer to the GUI: dumps the
# effective framebuffer geometry/format (the result of EDID/GOP mode selection) and halts, so the
# whole boot log can be photographed on serial-less hardware. Enable via `UNAOS_BOOTLOG=1`.
bootlog = []
# CLOCK-2: opt-in log timestamps on the kernel serial log. Prefixes each serial LINE with a compact
# fixed-width timestamp — monotonic ms since boot (`[  12345ms] `) before a civil anchor exists,
# flipping to UTC wall time (`[15:04:07Z] `) once SNTP/`setdate` anchors `crate::clock`. UART
# byte-stream ONLY — the fbcon + capture-ring mirrors keep the raw text, so tste/UNAOS.LOG are
# unchanged. DEFAULT OFF => module + prefix path vanish and serial is byte-identical (witness/mbench
# specs parse serial lines and must be unaffected). Enable via `UNAOS_LOGTS=1`.
logts = []
# PFWIRE self-test — proves the CPL-0 fault handlers put their diagnostics on the wire. It DELIBERATELY
# provokes a fatal page fault and HALTS the boot (a witness for the `enter_panic_mode` fix, review §5/C2),
# so it is a debug knob only: never on boot media, never in the regression battery. DEFAULT OFF => the
# self-test and its `arch::init` call site vanish and every artifact is byte-identical. x86_64 only.
# Enable via `UNAOS_PFWIRE_SELFTEST=1` (headless QEMU serial capture proves the faulting-address line
# reaches serial even when this core dies holding SERIAL1). See arch/x86_64/serial.rs::pfwire_selftest.
pfwire_selftest = []
# Raspberry Pi 4 build: the BCM2711 PL011 is not at the QEMU `virt` MMIO address the aarch64 serial
# hardcodes, so don't touch that UART (it would be RAM on the Pi) — rely on fbcon for on-screen
# output, like the Mac. Enable via `UNAOS_PI=1`.
pi = []
# Bare-metal Raspberry Pi 4 boot: build a flat `kernel8.img` the GPU ROM loads directly from the
# microSD slot (no UEFI/EDK2 — which can't read the SD post-handoff). Swaps the UEFI `_start(boot_info)`
# entry for a raw `_start` that sets up a stack, zeroes BSS, enables a minimal MMU (so atomics work),
# builds a BootInfo, and calls kernel_main. Implies `pi`. Enable via `UNAOS_BAREMETAL=1`.
baremetal = ["pi"]
# VUG-PAR: band-parallel Screen::flush — split the damaged row-copy blit (and large clears) into
# disjoint scanline bands dispatched to free secondary cores via sched::spawn_joinable + a JoinHandle
# join barrier, falling back to the single-core serial flush when no free AP is scheduled. Only
# compiled on the Pi bare-metal path (needs `sched`; gated `all(vugpar, baremetal)`). OFF => the
# parallel machinery + its sched dependency vanish and `Screen::flush` is byte-identical to the
# serial VUG-FPS path. The `[vugfps]` witness always reports `bands=N` (N=1 when off/serial). QEMU
# raspi4b stays deterministic (the join barrier is a correctness barrier; band count tracks the
# actually-scheduled cores). Enable via `UNAOS_VUGPAR=1`. See scripts/pi-vugpar-bench.md.
vugpar = []
# SMP-7: per-core secondary bring-up evidence on the Pi spin-table path (`arch/aarch64/smp.rs`).
# Records, for each AP, the release-write timestamp, whether/when it checked in (MMU on), the MPIDR it
# derived for itself, how far through bring-up it got, and any re-release count — then prints one
# `[smp7] cores online=<mask> missed=<mask> …` snapshot after bring-up settles. Read-only telemetry;
# DEFAULT OFF => every call site vanishes and no [smp7] line is emitted. NOTE this feature's knob-off
# state is byte-identical *to the rest of SMP-7*, not to the pre-arc image: the arc also ships an
# ALWAYS-ON change (the pre-release `DC CIVAC` over SECONDARY_STACKS + the release-loop refactor that
# the retry path shares), which is in every image regardless of this feature. Enable via `UNAOS_SMP7=1`.
smp7 = []
# SMP-7 recovery experiment: re-issue the spin-table release (write + DC CVAC + DSB + SEV) for an AP
# that has NOT checked in at all after its first wait, up to 3 times. Never applied to a core that
# arrived and then stopped (it has already left the spin-table — re-releasing it would be wrong).
# Implies `smp7`, so the retry count is always reported alongside the evidence that explains it.
# DEFAULT OFF. Enable via `UNAOS_SMP7_RETRY=1`.
smp7_retry = ["smp7"]
# K2 metal money-shot: turn k2_liveenf_launcher into a REAL two-boot cross-reboot power-cycle proof (instead of
# the same-boot simulate). One image, flashed once, booted twice: boot-1 (K2PRIV.BIN absent) creates+persists+
# LEAVES an owned file; power-cycle; boot-2 (K2PRIV.BIN present) verifies the LIVE boot rebuild reinstalled the
# row across the power-cycle (owner admitted BY NAME / impostor denied), then cleans. For the ATTENDED Pi bench
# only. Enable via `UNAOS_K2_LEAVE=1 ./arroyo kernel8`. OFF => the normal same-boot proof (battery byte-identical).
k2_leave = []
# SMP-8 witness: print the raw CPUECTLR_EL1 each core read at EL2 in `drop_to_el1` BEFORE any fix, plus
# whether the Cortex-A72 SMPEN bit (6) was already set by firmware — the `[smp8]` lines. A core that
# reads `smpen=0` was handed to us OUTSIDE cluster coherency, with a non-working exclusive monitor, and
# would hang on its first atomic: the candidate cause of the P53 "only 2 of 4 cores" metal report.
# Read-only telemetry; DEFAULT OFF => the reporter and its call site vanish. The SMPEN *set* itself is
# always on (required configuration per the A72 TRM, not a workaround). Enable via `UNAOS_SMP8=1`.
smp8 = []
# WEDGE-2: last-words breadcrumbs for the TAB->focus-raise chain (`src/wedge2.rs`). Writes a fixed
# four-byte token (`<F1>`..`<F9>`, plus `<f7>`/`<f8>` for a CONCURRENT composite on another core)
# straight at the UART data register BEFORE each phase of the chain — lock-free, unbuffered, bounded —
# so that when a core dies with IRQs masked mid-phase the LAST token on the torn wire names the phase
# that died. P66/P67v2/P68 (silicon) and x86 s44 all ended with `[wc-fv] focus raise` then silence,
# with WEDGE-1's `DRAIN STALLED` tripwire never firing, so the mechanism is arch-neutral and lives
# somewhere in that chain. INSTRUMENTATION ONLY — no fix, no behaviour change, no new locks, and the
# breadcrumb path takes NO existing lock. DEFAULT OFF => every call site vanishes, `mark` is an empty
# inline fn, and no `<F` token exists in the image (the regression gate runs knob-off and must be
# unchanged-green). Enable via `UNAOS_WEDGE2=1`. Token table: docs/dev/OS/08_VIDEO/engine.md §WEDGE-2.
wedge2 = []
# Run the SMP scheduler demo/self-test at boot (spawns demo threads across the APs, incl. the RwLock
# torn-read check). Opt-in via `UNAOS_SCHED_DEMO=1`: it's a QEMU-verified smoke test whose tick-based
# timing stalls boot for minutes on real hardware (uncalibrated APIC timer). Off => scheduler still
# inits, boot doesn't pause.
sched_demo = []
# SIMMER self-test (R23s1): under the aarch64 `virt` GICv3 boot, stage the per-core load animator,
# sample the vug per-core meter twice ~1 s apart and assert multiple animated cores show busy deltas,
# then stop and assert quiescence. Opt-in via `UNAOS_SIMMER=1` — a QEMU-verified smoke test of the
# `simmer` shell verb's machinery. Off => no boot-time simmer staging (the runtime verb is unaffected).
simmer_test = []
# DECRUD-1: the in-kernel `vug` / `pulse` / `vug bebox` shell demos (aarch64 only) — the fixed-point
# 3D crystal sculptor, the BeOS-Pulse-homage full-screen monitor and the BeBox tribute screen. Opt-in
# via `UNAOS_VUGDEMO=1`. Default OFF because the demos have SHIPPED EL0 REPLACEMENTS that the Pi
# actually runs: `VUG.ELF` (crates/user-vug) and `PULSE.ELF` (crates/user-pulse) are staged into the
# FAT root of every kernel8 image and are what the bench exercises (`UVUG:` streams while the
# in-kernel `[vugfps]` counter reads 0). Nothing on any boot path calls into `vug` — the three verbs
# are reached only by an operator typing them at the console — so OFF removes ~1.3 kloc of Ring-0
# software renderer from the image and changes no witness on any boot. The one part of `vug` that was
# never a demo, the VUG-HONESTY classifier entry point and its `parked_display_witness`, moved to
# `ui_status` (ungated, both arches), so the witness survives with this feature off.
# See docs/dev/OS/kernel-decrud.md §3.1.
vugdemo = []
# USB bring-up debug view for serial-less hardware: run the full main-loop USB path (enumeration +
# storage + hubs) but KEEP the boot log on the framebuffer (no GUI takeover, no fbcon detach) and
# print each input event, so external USB storage/keyboard/mouse enumeration AND live keypresses /
# mouse deltas are visible and photographable on metal. Enable via `UNAOS_USBDEBUG=1`.
usbdebug = []
# MT-INVESTIGATION (IVY): attended-bench-only probe for the Apple Wellspring trackpad's RAW
# (multitouch) sensor mode on the EHCI path. Runs the documented normal->pause->raw mode-switch
# sequence, hex-dumps the first few reports the endpoint then delivers, and restores the known-good
# pointer mode so the trackpad keeps working. Enable via `UNAOS_MTRAW=1`. Default OFF: the whole
# probe is `#[cfg]`-compiled out, so knob-off media are byte-identical. QEMU cannot produce
# Wellspring frames — this knob is only meaningful on the 2012 rMBP bench.
# Also (MTRAW DECODE): grows the interrupt-IN receive buffer to 1024 B (wsp's `WSP_BUFFER_MAX`) and
# arms the vendor-multitouch endpoint's qTD for the whole buffer, so a >MPS raw frame is accumulated
# by the controller instead of truncated at one packet; adds the TYPE2 frame decoder, its
# QEMU-runnable self-test, and the bounded per-frame decode witness. Decode + witness ONLY — no
# pointer events (see `mtraw_inject`).
mtraw = []
# MT-INVESTIGATION (IVY) debug SUB-KNOB of `mtraw`: additionally drive the pointer from the decoded
# first finger (absolute TYPE2 coordinates differenced into `pal::Event::Mouse` deltas). Default OFF
# and expected to STAY off until metal proves raw mode is stable — the live pointer path remains the
# 8-byte Report-ID-0x02 stream. Enable via `UNAOS_MTRAW_INJECT=1` (implies `mtraw`).
mtraw_inject = ["mtraw"]
# STOR-1: interrupt-driven x86 storage — route each storage syscall through a scheduled kernel
# "storage service task" that owns the xHCI BOT pump and blocks the submitter on a completion,
# retiring the staged-buffer family (U6bx staged read / U9x flush queue / U10x op-queue) in favour
# of live in-place reads/writes with synchronous semantics. Default OFF: the staged path compiles
# verbatim (byte-identical). Metal-PENDING (Panther Point transfer-IRQ behaviour is unproven), so it
# lands behind this knob until an attended 2012 bench confirms. x86_64 only. Enable via
# `UNAOS_IRQSTORAGE=1`. See unaos/docs/dev/OS/07_USB_STORAGE/x86_interrupt_storage.md.
irqstorage = []
# BOT-RECOVER test hook: deterministic, ONE-SHOT synthetic Bulk-Only Transport failure, injected at
# the CSW stage of the first WRITE(10). QEMU never times out a BOT transfer, so without this knob the
# BOT Reset Recovery path (drivers/xhci/mod.rs::bot_recover) is metal-only and untestable in the
# regression suite. With it, a headless run exercises the whole sequence — Bulk-Only Mass Storage
# Reset, CLEAR_FEATURE(ENDPOINT_HALT) on both bulk endpoints, Stop/Reset Endpoint + Set TR Dequeue
# Pointer, and the one bounded retry — against a device genuinely left parked in its CSW phase.
# ATTENDED/TEST ONLY: never enable on boot media. Default OFF => byte-identical (fully cfg-compiled
# out). Enable via `UNAOS_BOTFAULT=1`.
botfaultinject = []
# ONSET-2 (M3 knob 1): grow the STORAGE slot's two BULK transfer rings from 16 TRBs to 64. The
# one-variable discriminator for the arc's ranked hypothesis (the doorbell that must restart the
# controller across a Link TRB does not take): changing the ring length changes the wrap FREQUENCY
# and every wrap POSITION and nothing else — no command sequence, no TD shape, no protection, and
# the lap guard's two-slot margin scales with the ring by construction. All three genuine onsets in
# the rmbp-gr8 capture are an OUT data stage at ring index 0, immediately behind a freshly written
# Link TRB, and boots B and G reproduce the failure deterministically at the same LBA. If the
# failure MOVES or VANISHES the wrap is causal; if it stays put the correlation was coincidence and
# the hypothesis dies. EP0, the command ring, the hub interrupt ring and the HID rings are untouched.
# METAL EXPERIMENT ONLY. Default OFF => BOT_RING_TRBS is 16 and the artifact is byte-identical.
# Enable via `UNAOS_BOTRING64=1`.
botring64 = []
# BOT-PARK test hook: a synthetic TRANSPORT WEDGE. After the storage device has completed
# `BOT_WEDGE_AFTER` transactions, every subsequent BOT attempt on that slot returns `Timeout`
# WITHOUT putting anything on the wire — the exact shape of the [pi0-b1b2] metal wedge, where the
# CBW went out, IRQ_COUNT stayed 0 and the event ring was provably empty. It exists because QEMU's
# `usb-storage` cannot wedge: it always answers, so the retry ladder's global floor (escalating
# back-off, the per-device retry budget, the park) has no other way to be walked end-to-end outside
# an attended metal sitting. With it, a QEMU boot reaches `:: BOT: PARKED … ::` and stops, which is
# the whole claim of the arc.
# ATTENDED/TEST ONLY: never enable on boot media — it makes storage permanently unusable by design.
# Default OFF => fully cfg-compiled out and the artifact is byte-identical. Enable via
# `UNAOS_BOTWEDGE=1`.
botwedge = []
# (`botcbwioc` lived here. DELETED 2026-07-30: awaiting the CBW as its own stage is now
