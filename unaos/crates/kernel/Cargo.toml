# JETSON-EL0 (M1b): the Jetson Orin (Tegra234) EL0/userspace chain. Through M1a the tegra path reached
# EL1 + the scheduler (`boot_tegra`'s EL2 -> EL1 drop, `sched::run_capstone_boot_core`) and stopped
# there: every piece of EL0 machinery — `arch::aarch64::syscall`, `arch::aarch64::bus`, and `sched`'s
# `spawn_user*`/`user_task_trampoline`/slot-teardown arms — was `#[cfg(feature = "baremetal")]`, i.e.
# BCM2711/Pi-only, because the per-task address-space slots those arms consume live in `boot.rs`, which
# is Pi MMU code (its own EL1 identity regime, its own `USER_REGION` BSS window).
#
# `tegra_el0` widens exactly those gates to the tegra path and supplies the missing half — the M6d slot
# system re-implemented against the tegra EL1 regime in `arch/aarch64/mmu_tegra_el0.rs`: a 4 KiB L2/L3
# table chain hung off an OTHERWISE-UNUSED L1 GiB of `mmu_tegra`'s `L1_EL1` (NOT GiB 0, which on Tegra234
# is the Device-nGnRE peripheral window the kernel's own UART lives in — the Pi's "demote L1[0] to a
# table" move is unavailable here), per-slot nG leaves + ASID 1..=8, the same W^X leaf recipe boot.rs
# uses (code RO-both + EL0-executable, data EL0/EL1-RW + UXN|PXN), and HEAP-backed slot frames so the
# backing is drawn from the HEAP-GUARD-vetted DMA window and can never land in an SNOC-firewalled
# carveout hole (`mmu_tegra::carveout_holes`), which a raw-region allocation could.
#
# Implies `tegra`. DEFAULT OFF => the widened gates all read `baremetal` again, `mmu_tegra_el0` is not
# compiled, the `tegra_early_stop` spawn block vanishes, and the jetson media is BYTE-IDENTICAL to
# baseline (verified by building `esp-jetson` knob-off before and after this arc and comparing
# sha256 of target/aarch64_esp/kernel.elf). Enable via `UNAOS_TEGRA_EL0=1`. QEMU cannot exercise it
# (the `tegra` feature has no QEMU model — the virt gate is a different machine), so the round-trip
# witness is metal-owed/attended. See arch_arm64.md §JETSON-EL0.
