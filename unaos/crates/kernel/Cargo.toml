xcarve_relink = ["tegra"]
# XUSBFW (jetson bench): the Tegra234 XUSB Falcon firmware-RELOAD scaffold
# (arch/aarch64/xusb_tegra.rs::xusbfw). Design + guarded entry point only — NOT a working reload
# (the signed NVGI firmware container is bench-only and never in-tree, so the IMEM/DMEM byte layout
# is unknown and the scaffold STOPs, witnessed, at the load boundary). Build-time firmware injection
# lives in its own crate, `crates/xusb-fw`, pulled in here as an OPTIONAL dependency: the blob is
# `include_bytes!`d from an absolute extern path ONLY when this feature AND UNAOS_XUSB_FW_PATH are
# both set, so the default build and all media are blob-free by construction. Implies `tegra`.
# Enable via UNAOS_XUSBFW=1. See ~/.claude/plans/unaos/review/xusb-fw-reload-DESIGN.md and
# arch_arm64.md §XUSBFW.
#
# ⚠ THE INJECTION POINT IS A SEPARATE CRATE FOR A MEASURED REASON — do not fold it back into a
# `crates/kernel/build.rs`. 12b0993c did exactly that and its comments claimed the default build
# stayed "byte-identical". Blob-free: TRUE, and verified. Byte-identical: FALSE, and measured false.
# A build script's mere PRESENCE changes cargo's `-C metadata` for the crate that carries it, which
# seeds that crate's v0 disambiguator (`Cs…_12unaos_kernel`); every v0 symbol name and the LLVM
# module hash move with it, codegen units link in a different order, and `.text`/`.rodata` are
# re-laid out. Knob-off x86 `kernel.elf` a3ef1b4c… -> 1a179727… (+1608 B); knob-off Pi
# `kernel8.img` 9438fa9d… -> c54da061… (same size, 265,310 bytes differing). Control: rebuilding
# 12b0993c with ONLY build.rs deleted reproduced the parent byte-for-byte on all four artifacts, so
# the script alone was the cause. Semantically inert and reversible, but it re-baselines every
# stored pre-XUSBFW media hash on all three hardware tracks.
#
# With the script in its own optional crate the knob-off kernel carries no build script at all, and
# the re-baselining is UNDONE — measured, one directory, knob-off, 9de45011+this change vs the
# pre-XUSBFW parent 8665a464: `esp-x86` kernel.elf a3ef1b4c… == a3ef1b4c… (1,688,752 B) and
# `kernel8` kernel8.img 9438fa9d… == 9438fa9d… (1,275,144 B), byte-for-byte on both. See
# crates/xusb-fw/Cargo.toml.
xusbfw = ["tegra", "dep:unaos-xusb-fw"]

