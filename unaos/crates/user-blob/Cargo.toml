#
# The EL0 "hello" user program (M6c) — built as a SEPARATE link product so the user routine lives
# OUT of the kernel's .text. `arroyo kernel8` builds this for the bare aarch64 target and
# `llvm-objcopy -O binary`s it to `target/user_blob.bin`, which the kernel `include_bytes!`s and
# copies into the identity-mapped EL0 code page at boot (arch/aarch64/syscall.rs::setup).
#
# The empty [workspace] table below makes this crate its OWN workspace root, so the parent UnaOS
# workspace (unaos/Cargo.toml) never tries to build this no_std/no_main EL0 blob for the host
# toolchain during `cargo build`/`./arroyo check`. It is built explicitly, for a custom target, only
# by the `kernel8` arroyo step.
[workspace]

[package]
name = "user-blob"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-blob"
path = "src/main.rs"

# K2 (make-enforcement-LIVE): two additional flat EL0 programs built by the SAME `cargo build` the
# `kernel8` arroyo step already runs (all `[[bin]]`s build together; the shared user-blob.ld applies to
# each). Distinct 8.3 filenames on the card => distinct `prog:<NAME>` principals — the honest precondition
# for LIVE cross-reboot enforcement. `owner-blob` (K2OWN.BIN) privately creates+owns K2PRIV.BIN; `imp-blob`
# (K2IMP.BIN) is a non-owner that must be denied. See arch/aarch64/syscall.rs `k2_liveenf_launcher`.
[[bin]]
name = "owner-blob"
path = "src/owner.rs"

[[bin]]
name = "imp-blob"
path = "src/imp.rs"

# opt-level "s" (size) per the M6c brief: a tiny flat blob. panic=abort (no unwinder in a no_std EL0
# program); lto folds the single routine. No dependencies.
[profile.release]
opt-level = "s"
panic = "abort"
lto = true
