#
# The EL0 "hello" user program (M6c) — built as a SEPARATE link product so the user routine lives
# OUT of the kernel's .text. `arroyo kernel8` builds this for the bare aarch64 target and
# `llvm-objcopy -O binary`s it to `target/user_blob.bin`, which the kernel `include_bytes!`s and
# copies into the identity-mapped EL0 code page at boot (arch/aarch64/syscall.rs::setup).
#
# The empty [workspace] table below makes this crate its OWN workspace root, so the parent UnaOS
# workspace (unaos/Cargo.toml) never tries to build this no_std/no_main EL0 blob for the host
# toolchain during `cargo build`/`./arroyo check`. It is built explicitly, for a custom target, only
# by the `kernel8` arroyo step.
[workspace]

[package]
name = "user-blob"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-blob"
path = "src/main.rs"

# K2 (make-enforcement-LIVE): two additional flat EL0 programs built by the SAME `cargo build` the
# `kernel8` arroyo step already runs (all `[[bin]]`s build together; the shared user-blob.ld applies to
# each). Distinct 8.3 filenames on the card => distinct `prog:<NAME>` principals — the honest precondition
# for LIVE cross-reboot enforcement. `owner-blob` (K2OWN.BIN) privately creates+owns K2PRIV.BIN; `imp-blob`
# (K2IMP.BIN) is a non-owner that must be denied. See arch/aarch64/syscall.rs `k2_liveenf_launcher`.
[[bin]]
name = "owner-blob"
path = "src/owner.rs"

[[bin]]
name = "imp-blob"
path = "src/imp.rs"

# BANDY-1 M4 (Peter's E verdict): midden — program #3, the first real (non-fixture) on-UnaOS
# program. Parses ls/cat/cp text into typed native bus frames (SYS_MSEND/SYS_MRECV) and prints
# the replies; carries the EL0 equivalence-witness legs. Staged as MIDDEN.BIN by `arroyo kernel8`.
[[bin]]
name = "midden-blob"
path = "src/midden.rs"

# Size-optimised per the M6c brief: these are tiny flat blobs and every one of them must fit a SINGLE
# 4 KiB EL0 code page (`boot::USER_CODE_SIZE`), which `arroyo kernel8` asserts per blob.
#
# WC-C moved this from "s" to "z". midden's bus-stats window took it to 4236 B under "s" — over the page
# — and the overage was not in the new code (~370 B of it) but in what LLVM chose to unroll and inline
# around it; hand-golfing the render bought tens of bytes at a time while making it worse to read. "z"
# is the honest lever: it asks the compiler for the size the page budget actually requires (midden lands
# at 3792 B, ~300 B of headroom) instead of paying for speed no status readout needs. The other blobs
# shrink or stay identical in behaviour; each is re-asserted against the page budget at build time.
# panic=abort (no unwinder in a no_std EL0 program); lto folds the single routine. No dependencies.
[profile.release]
opt-level = "z"
panic = "abort"
lto = true

# ABIFREEZE: the syscall ABI, imported rather than re-typed. This crate used to declare its own copy
# of the numbers it happened to use; `una-abi` is now the single declaration, shared with both
# kernels. It is `no_std`, has no dependencies of its own, and contains nothing but `const` — so it
# contributes ZERO bytes to this image and the page/size budgets are unchanged.
[dependencies]
una-abi = { path = "../una-abi" }
