#
# VEINCORE M3 (rmbp-ledger B304): VEIN.BIN — Vein on UnaOS, a ring-3 FULFILLER that OWNS the chat verbs
# (130..=133) on the bus wire (BANDY3 registration) and answers ChatSend through vein_core's providers:
# Echo (no network) and Relay (the bench machine's host Vein over the serial console). Static ELF64 like
# user-prefs, built by arroyo's build_user_vein_x86 and staged as APPS/VEIN.BIN on the ESP and the x86 DATA
# volume. Links vein_core WITHOUT `alloc` — the whole program lives in the 16 KiB ring-3 window.
#
# The empty [workspace] table makes this crate its OWN workspace root (the GATE-USER shape).
[workspace]

[package]
name = "user-vein"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "user-vein"
path = "src/main.rs"

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1

[dependencies]
una-abi = { path = "../una-abi" }
vein_core = { path = "../../libs/sys/vein_core", default-features = false }
