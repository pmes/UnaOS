[workspace]
members = [
    "builder", "crates/boot-info", "crates/bootloader",
    "crates/kernel",
    # The frozen syscall ABI. A workspace member (the kernel depends on it) AND a path dependency of
    # every `user-*` crate, each of which is its own workspace root — a path dep across workspaces is
    # ordinary cargo, and it is what makes both sides of a syscall compile against the same literal.
    "crates/una-abi",
    "crates/net",
    "crates/rast",
]
# The Ring-0-embeddable cores under `libs/` (e.g. `libs/sys/helm`) are members of
# the root host workspace, not the kernel workspace — the kernel pulls them as
# path deps with `default-features = false`. Excluded here so they attach upward.
exclude = ["libs"]
resolver = "2"

