[package]
name = "js_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "JSCORE (SR55): ECMAScript 2025 from the specification — lexer, parser, bytecode compiler, VM with an exact tracing GC, and the built-ins — no_std + alloc, zero dependencies."

# JSCORE (LEDGER SR55, R83): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, NO dependencies. The from-spec
# replacement for `boa_engine` in Aether (SR31 DEPS: chicken wire). Proof (tests/): test262 at a pinned commit
