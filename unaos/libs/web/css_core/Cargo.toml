[package]
name = "css_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "CSSCORE (SR47): CSS Syntax Level 3, Selectors Level 4 and the cascade helpers, written from the specifications — no_std + alloc, zero dependencies."

# CSSCORE (LEDGER SR47, R83): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, NO dependencies. It is the
# from-spec replacement for the `cssparser` + `selectors` crates Aether leans on today (SR31 DEPS: both chicken
# wire). The matcher works over the abstract `Element` trait (src/matching.rs); html_core's DOM implements it
# in the follow-on. Proof (tests/): css-parsing-tests fetched at test time (pinned by URL + sha256 in
# `vectors.txt`, skipped offline), the WPT Selectors-API matching suite re-expressed over a test DOM, and the
# Chromium oracle over EYES's 18 pages (fixtures under tests/oracle/, regenerated by tools/oracle.mjs).
# Design doc: docs/dev/evidence/web-1005/CSSCORE.md.

[dependencies]

# The KAT harness verifies fetched vector files with UnaOS's own SHA-256 (in-tree, zero third-party crates).
[dev-dependencies]
crypto_core = { path = "../../sys/crypto_core" }
