<!-- tests: stacking contexts (CSS 2.2 Appendix E): z-index inside a z-indexed parent stays inside it, positioned descendants of a z-index:auto parent are hoisted to the root context, negative z-index under in-flow content, opacity groups composite once, a flex item's z-index -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Stacking</title>
<style>
body { margin: 20px; font-family: sans-serif; font-size: 14px; }
.row { position: relative; height: 130px; margin-bottom: 10px; }
.b { position: absolute; width: 100px; height: 80px; color: white; padding: 4px; box-sizing: border-box; }
.ctx { position: relative; z-index: 1; width: 1px; height: 1px; }
.r { background: #e63946; } .g { background: #2a9d8f; } .u { background: #1d3557; } .y { background: #e9c46a; color: #222; }
.neg { position: absolute; z-index: -1; left: 10px; top: 10px; width: 200px; height: 40px; background: #a8dadc; }
.op { opacity: 0.5; position: relative; height: 90px; }
.flex { display: flex; height: 70px; }
.flex div { width: 90px; height: 60px; margin-right: -30px; }
</style></head><body>
<div class="row">
  <div class="ctx"><div class="b r" style="left:0;top:0;z-index:100">z100 in z1</div></div>
  <div class="b g" style="left:50px;top:30px;z-index:2">z2 sibling</div>
  <div style="position:relative"><div class="b u" style="left:300px;top:0;z-index:3">z3 in auto</div></div>
  <div class="b y" style="left:350px;top:30px;z-index:2">z2 later</div>
</div>
<div class="row" style="height:60px"><div class="neg"></div>In-flow text paints above the negative z-index box behind it.</div>
<div class="op"><div class="b r" style="left:0;top:0">opacity</div><div class="b u" style="left:50px;top:30px">group</div></div>
<div class="flex"><div class="r" style="z-index:2"></div><div class="g"></div><div class="u" style="z-index:1"></div></div>
</body></html>
