<html><head><meta charset="utf-8"><title>Boxes</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #fafafa; }
.b { margin: 16px 0; padding: 12px; background: white; }
.solid { border: 4px solid #e63946; }
.dashed { border: 3px dashed #457b9d; border-radius: 10px; }
.dotted { border: 3px dotted #2a9d8f; }
.round { border: 2px solid #333; border-radius: 20px; background: #ffe8d6; }
.chip { display: inline-block; padding: 4px 10px; margin-right: 6px; border-radius: 12px; background: #264653; color: white; font-size: 13px; }
.sides { border-top: 6px solid #f4a261; border-bottom: 2px solid #264653; }
</style></head><body>
<div class="b solid">Solid border</div>
<div class="b dashed">Dashed border with radius</div>
<div class="b dotted">Dotted border</div>
<div class="b round">Rounded box</div>
<div class="b sides">Different sides</div>
<div><span class="chip">alpha</span><span class="chip">beta</span><span class="chip">gamma</span></div>

</body></html>
