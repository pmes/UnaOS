<html><head><meta charset="utf-8"><title>Form</title>
<style>
body { font-family: sans-serif; padding: 20px; font-size: 14px; }
form { width: 420px; }
label { display: block; margin-top: 10px; font-weight: bold; }
input[type=text], input[type=email], input[type=password], select, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; }
.row { margin-top: 10px; }
button { margin-top: 14px; padding: 8px 16px; }
button.primary { background: #0066cc; color: white; border: none; border-radius: 4px; }
</style></head><body>
<h2>Create account</h2>
<form>
<label for="n">Name</label><input type="text" id="n" placeholder="Jane Doe">
<label for="e">Email</label><input type="email" id="e" value="jane@example.org">
<label for="p">Password</label><input type="password" id="p" value="secret">
<label for="c">Country</label><select id="c"><option>Norway</option><option>Japan</option></select>
<div class="row"><input type="checkbox" id="t" checked=""> <span>I accept the terms</span></div>
<div class="row"><input type="radio" name="r" checked=""> Monthly <input type="radio" name="r"> Yearly</div>
<label for="m">Message</label><textarea id="m" rows="3">Hello there.</textarea>
<button class="primary" type="submit">Sign up</button> <button type="reset">Reset</button>
</form>

</body></html>
