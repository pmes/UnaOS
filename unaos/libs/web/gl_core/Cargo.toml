# are software. Aether's `WebGLRenderingContext` (handlers/aether/src/js/webgl.rs) is the WebIDL face; AETHER.ELF
# links this crate by path later. Design: the first commit body of the series and docs/dev/evidence/webgl1/WEBGL1.md.
