[package]
name = "make_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Vug's Make core: the machine model (MDES-shaped kinematics, ISO 13399 tools, stock, fixtures), manufacturing Ops on the design, the Program IR with its kinematic pass, the grbl / Marlin / LinuxCNC dialects and the review Helm's gate reads — shared by Ring 0 and Ring 3."

# VUGMAKE (LEDGER SR467): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, the timeline_core shape (BP-vug-4): a shared
# core under `unaos/libs/cad/`, a member of the ROOT host workspace, linkable by the kernel by path with
# `default-features = false`. libm is the one f64 math (MATH-ONE, the timeline_core / icc_core line).
# GEOM SHIM: geom_core (VUGGEOM SR464) was unfolded when this crate was cut; `src/geom.rs` is a one-file shim. The swap
# is that file's bodies -> `pub use geom_core::{..}` + adapters, and this line: geom_core = { path = "../geom_core" }
[dependencies]
libm = { version = "0.2", default-features = false }

[features]
default = ["std"]
# The seam only: nothing in `src/` is std-gated (midden_core's spelling, so a kernel `default-features = false` is honest).
std = []
