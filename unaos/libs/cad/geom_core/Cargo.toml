[package]
name = "geom_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Vug's geometry core: f64 vectors, matrices, transforms, the one tolerance policy (Tol), bounds, exact orientation predicates and closed-form intersections — shared by Ring 0 and Ring 3."

# VUGGEOM (LEDGER SR464): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, the timeline_core manifest shape: a shared core
# under `unaos/libs/cad/`, a member of the ROOT host workspace, linkable by the kernel by path with `default-features = false`.
# libm is the one f64 math (sqrt, trig) beside timeline_core / icc_core / svg_core (MATH-ONE SR362).
[dependencies]
libm = { version = "0.2", default-features = false }

[features]
default = ["std"]
# The seam only: nothing in `src/` is std-gated (midden_core's spelling, so a kernel `default-features = false` is honest).
std = []
