[package]
name = "brep_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Vug's B-rep core: topology with persistent Ids over the analytic surfaces (plane, cylinder, cone, sphere, torus), the validator, primitives, extrude / revolve of a sketch profile, closed-form mass properties and chord-bounded tessellation into mesh_core — shared by Ring 0 and Ring 3."

# VUGBREP1 (LEDGER SR468): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, the timeline_core shape: a shared core under
# `unaos/libs/cad/`, a member of the ROOT host workspace, linkable by the kernel by path with `default-features = false`.
# Its siblings are the real crates by path (VUGBREPSWAP, LEDGER SR492: src/dep.rs and its shims are gone): geom_core the
# one Vec / Tol / predicates / closed forms, sketch_core the Profile, mesh_core the Mesh.
[dependencies]
geom_core = { path = "../geom_core", default-features = false }
sketch_core = { path = "../sketch_core", default-features = false }
mesh_core = { path = "../mesh_core", default-features = false }
libm = { version = "0.2", default-features = false }

[features]
default = ["std"]
# The seam only: nothing in `src/` is std-gated (midden_core's spelling, so a kernel `default-features = false` is honest).
std = []
