[package]
name = "hevc_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "HEVCPARSE (SR199): a from-specification H.265 / HEVC bitstream parser and intra decoder (ITU-T Rec. H.265) — NAL units (Annex B and hvcC), VPS / SPS / PPS, slice segment headers, CABAC with every context table, and 8-bit 4:2:0 intra pictures (coding quadtree, 35 intra modes, DCT / DST, dequantisation, deblocking, SAO) — shared by Ring 0 and Ring 3; Stria's hvc1 / hev1 / V_MPEGH/ISO/HEVC video codec."

# HEVCPARSE (LEDGER SR199, CHARTER Stria shared-core): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`. The decoding
# dependency is h264_core: its CABAC arithmetic decoding engine (H.265 9.3.4.3 is that engine bit for bit), its RBSP bit
# reader, its NAL framing (emulation prevention, Annex B, length prefixes) and its output `Frame` are reused, not copied.
[dependencies]
h264_core = { path = "../h264_core" }
# HEVCLEVELLINE (LEDGER SR368, HEVCSEI-MD5): the second runtime dep — crypto_core's MD5 (no_std, zero dependencies) checks
# the picture MD5 SEI (`sei::plane_md5`); the conformance walker's output md5 (HEVCCONF-MD5 SR365) uses the same digest.
crypto_core = { path = "../../sys/crypto_core" }

[features]
default = []
# `std` only adds `std::error::Error` for `Error`.
std = ["h264_core/std"]

