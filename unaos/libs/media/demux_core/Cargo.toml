[package]
name = "demux_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Stria's container core: ISOBMFF/MP4 (progressive and fragmented) and Matroska/WebM demuxers behind one Demuxer API, plus minimal writers for test media — shared by Ring 0 and Ring 3."

# PLAYBACK (LEDGER SR26): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, NO dependencies — written
# from ISO/IEC 14496-12 and the Matroska specification (RFC 9559). A member of the ROOT host workspace
# (Stria links it); the kernel may link it by path.
[dependencies]

# VIDEOPLAYER (rmbp-ledger B434): the test-f KAT drives the kernel Player's exact chain on the host — these
# containers through the picture cores and a WebM's Vorbis track through audio_core. Test-only; the crate itself
# keeps NO dependencies.
[dev-dependencies]
vp8_core = { path = "../vp8_core" }
av1_core = { path = "../av1_core" }
audio_core = { path = "../audio_core" }
