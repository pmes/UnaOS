[package]
name = "h264_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "H264CORE (SR133): a from-specification H.264 / AVC decoder (ITU-T Rec. H.264) — Baseline, Main and High profiles at 8-bit 4:2:0, CAVLC and CABAC, I/P/B, 4x4 and 8x8 transforms, weighted prediction, the DPB with output reordering, Annex B and avcC framing — shared by Ring 0 and Ring 3; Stria's avc1 / V_MPEG4/ISO/AVC video codec."

# H264CORE (LEDGER SR133, R83): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, and NO dependencies. The constant
# tables are generated by tools/gen_tables.py into src/tables.rs (one file, never hand-edited) from the tables of the
# Recommendation itself. gneiss_pal's `dsp::video` (MP4 avc1/avc3, Matroska V_MPEG4/ISO/AVC) links it; the kernel may
# link it by path.
[dependencies]

[features]
default = []
# `std` only adds `std::error::Error` for `Error`; the decoder itself never needs it.
std = []
