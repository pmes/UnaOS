[package]
name = "vp9_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "VP9CORE (SR116): a from-specification VP9 decoder (VP9 Bitstream & Decoding Process Specification v0.6) — profiles 0 and 2 (8/10/12-bit 4:2:0), superframes, scaled references, show_existing_frame — shared by Ring 0 and Ring 3; Stria's V_VP9 / vp09 video codec."

# VP9CORE (LEDGER SR116, R83): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, and NO dependencies. The constant
# tables are generated by tools/gen_tables.py into src/tables.rs (one file, never hand-edited) from the reference
# decoder's tables (libvpx, BSD-3-Clause: third_party/LICENSE-libvpx). gneiss_pal's `dsp::video` (WebM V_VP9, MP4
# vp09) links it; the kernel may link it by path.
[dependencies]

# The KATs read the libvpx conformance vectors' WebM container through UnaOS's own demuxer. Test-only; the crate
# itself keeps NO dependencies.
[dev-dependencies]
demux_core = { path = "../demux_core" }

[features]
default = []
# `std` only adds `std::error::Error` for `Error`; the decoder itself never needs it.
std = []
