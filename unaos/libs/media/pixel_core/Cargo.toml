[package]
name = "pixel_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "PIXELCORE (SR25): the still-image decoders UnaOS owns — PNG, JPEG, GIF, BMP, QOI, WebP lossless — written from the specifications, no_std + alloc, shared by Ring 0 and Ring 3."

# PIXELCORE (SR25, R83): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, and NO dependencies — the
# prefs_core/midden_core shape: a member of the ROOT host workspace (Aether and tools/pixel-check link it)
# and a path dep of the kernel (`video/png.rs` and `selfhost/inflate.rs` re-export from here).
[dependencies]

# Test-only second opinion (the ledger row names it): the `image` crate decodes the same KAT files and the
# tests compare pixel-for-pixel. It never reaches the library — a dev-dependency is not linked into it.
[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "bmp", "qoi", "webp", "jpeg"] }
