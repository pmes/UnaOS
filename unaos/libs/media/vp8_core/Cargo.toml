[package]
name = "vp8_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "VP8CORE (SR40): a from-specification VP8 decoder (RFC 6386) — key and inter frames to I420 — shared by Ring 0 and Ring 3; the lossy half of WebP and the V_VP8 video codec."

# VP8CORE (LEDGER SR40, R83): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, and NO dependencies —
# written from RFC 6386 ("VP8 Data Format and Decoding Guide"). The constant tables are generated by
# tools/gen_tables.py into src/tables.rs (one file, never hand-edited). pixel_core (lossy WebP) and
# gneiss_pal's `dsp::video` (WebM V_VP8) link it; the kernel reaches it through pixel_core.
[dependencies]

[features]
default = []
# `std` only adds `std::error::Error` for `Error`; the decoder itself never needs it.
std = []
