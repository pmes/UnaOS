[package]
name = "infer_core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "INFERCORE (SR57): UnaOS's own CPU inference core — safetensors / ONNX-initializer readers, the BERT WordPiece tokenizer and the BERT encoder (sentence embeddings) — no_std + alloc, zero dependencies."

# INFERCORE (LEDGER SR57, R83): `#![no_std]` + `alloc`, `#![forbid(unsafe_code)]`, NO dependencies.
# Written from the specifications: the safetensors format (huggingface/safetensors README), onnx.proto3
# (initializers only), the BERT paper + the HF `BertModel` / `BertTokenizer` definitions, UAX #15 (NFD).
# The Unicode data is generated by tools/gen_unicode.py into src/unicode_tables.rs (data only, never
# hand-edited) from the UnicodeData.txt files pinned in vectors.txt. gneiss_pal's `local-embed`
# feature (Vein's local embedder, EMBED B317) links it; the metal can link it by path.
[dependencies]

[features]
default = []
# `std` only adds `std::error::Error` for `Error`; the core never needs it.
std = []

[dev-dependencies]
# The KAT files are sha256-pinned; the digest is UnaOS's own (CRYPTOCORE, SR27).
crypto_core = { path = "../../sys/crypto_core" }
