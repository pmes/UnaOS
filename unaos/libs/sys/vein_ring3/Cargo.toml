#
# LUMENAPP (rmbp-ledger B323, R82): Vein for ring 3 — the syscall-backed half of the Vein LIBRARY that a
# ring-3 program links to talk to the provider ITSELF (no daemon, no bus chat verbs, nothing resident):
# SYS_RESOLVE + the NETRING3 TCP syscalls as a `vein_core::client::Transport`, TLS 1.3 over it
# (embedded-tls 0.19, the crate the NETRING3 spike measured; x86_64 only, the ELF window is x86's), the
# Principia reads (BUS_VERB_PREF_GET, ns `vein`) and the UnaFS key file (SYS_STAT id check, SYS_OPEN).
# Callers: crates/user-lumen (LUMEN.ELF) now; the smart installer's diagnosis program next.
#
# NOT a member of any workspace (it builds only for the ring-3 targets, as a path dependency of a user-*
# crate, each of which is its own workspace root). The pure, host-tested half is vein_core.
[package]
name = "vein_ring3"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["tls"]
tls = []

[dependencies]
una-abi = { path = "../../../crates/una-abi" }
vein_core = { path = "../vein_core", default-features = false }

# TLS rides only where the ELF window exists (x86_64): ~80 KiB of code and ~20 KiB of record buffers.
[target.'cfg(target_arch = "x86_64")'.dependencies]
embedded-tls = { version = "0.19", default-features = false }
embedded-io = "0.7"
rand_core = { version = "0.6", default-features = false }
