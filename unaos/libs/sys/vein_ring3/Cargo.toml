# LUMENAPP (rmbp-ledger B323, R82): Vein for ring 3 — the syscall-backed half of the Vein LIBRARY that a
# ring-3 program links to talk to the provider ITSELF (no daemon, no bus chat verbs, nothing resident):
# SYS_RESOLVE + the NETRING3 TCP syscalls as a `vein_core::client::Transport`, the Principia reads
# (BUS_VERB_PREF_GET, ns `vein`) and the UnaFS key file (SYS_STAT id check, SYS_OPEN).
# Callers: crates/user-lumen (LUMEN.ELF), crates/user-net (NET.ELF); the smart installer's diagnosis program next.
#
# VEINTLS (LEDGER SR36, R83): TLS 1.3 is UnaOS's OWN `tls_core` (TLSCORE, SR28) — `embedded-tls`,
# `embedded-io` and `rand_core` are gone from this crate and from the tree. Every connection is verified
# against /system/trust/roots.pem at SYS_TIME; there is no insecure mode. Crypto: CRYPTOCORE's provider
# behind feature `cryptocore` (ring-3 programs turn it on); until CRYPTOCORE's fold file is on the branch the
# feature stops the build at tls_core's `cryptocore_provider.rs` with the exact list of what is missing.
# Needs `alloc`: a program declares `vein_ring3::heap::Heap` as its `#[global_allocator]`.
#
# A member of the ROOT host workspace since VEINTLS (so `cargo test -p vein_ring3` runs the offline
# handshake + Messages round trip on the host); still a path dependency of each user-* crate (each its own
# workspace root) for the ring-3 targets. Third-party crates: none (dev: none either — the test provider
# is tls_core's own feature).
[package]
name = "vein_ring3"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = []
# The product crypto provider (CRYPTOCORE). Ring-3 programs enable it; host tests never do.
cryptocore = ["tls_core/cryptocore", "dep:crypto_core"]

[dependencies]
una-abi = { path = "../../../crates/una-abi" }
vein_core = { path = "../vein_core", default-features = false }
tls_core = { path = "../tls_core" }
crypto_core = { path = "../crypto_core", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
# TEST OPERAND ONLY (R83, TLSCORE's rule extended to this crate's own tests by the VEINTLS brief): tls_core's
# RustCrypto `test-provider` stands in for CRYPTOCORE until RSA verify and P-384 land there.
tls_core = { path = "../tls_core", features = ["test-provider"] }
