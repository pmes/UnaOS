description = "Matrix core: the workspace tree model (Volume, genesis tree, ignore rules), the Finder's listing and sandbox, the token indexer and the query model, shared by the host Matrix handler and ring 3."

# MATRIXCORE (LEDGER SR99, R104). CHARTER: Matrix owns The Map — files, the workspace indexer and finder
