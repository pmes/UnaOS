[package]
name = "unafs"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
# Host-only backends live behind the default `std` feature; the core on-disk
# format + BlockDevice seam are no_std + alloc.
gneiss_pal = { path = "../../../../libs/gneiss_pal", optional = true }
bandy = { path = "../../../../libs/bandy", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
bincode = { version = "2.0", default-features = false, features = ["serde", "alloc"] }
thiserror = { version = "2.0", default-features = false }
# Pure-Rust no_std float math for the query engine's cosine similarity. Used
# unconditionally (std builds too) so host and kernel score along ONE code
# path and results stay bit-identical.
libm = { version = "0.2", default-features = false }
anyhow = { version = "1.0.102", optional = true }
memmap2 = { version = "0.9", optional = true }

[features]
default = ["std"]
# `std` pulls in the host-native pieces: the FileDevice backend, the memmap
# reader (io module), and the bandy event bus. no_std builds get the pure
# on-disk types, the codec seam, the BlockDevice trait, and MemDevice.
std = [
    "dep:gneiss_pal",
    "dep:bandy",
    "dep:anyhow",
    "dep:memmap2",
    "serde/std",
    "bincode/std",
    "thiserror/std",
]
