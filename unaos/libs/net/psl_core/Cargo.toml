[package]
name = "psl_core"
version = "0.1.0"
edition = "2024"
# The code is LGPL-3.0-or-later; src/table.rs is generated from the Public Suffix List, whose data is MPL-2.0.
license = "LGPL-3.0-or-later AND MPL-2.0"
description = "UnaOS's Public Suffix List core — the list as a generated table, public_suffix() and registrable_domain() — no_std, zero dependencies."

# NETDEBT (LEDGER SR97). `#![no_std]` (no alloc either: every answer is a slice of the input),
# `#![forbid(unsafe_code)]`, NO dependencies. Written from https://publicsuffix.org/list/ ("Formal algorithm");
# the table (src/table.rs) is generated by tools/gen_psl.py from public_suffix_list.dat, whose sha256 the table
# records. Consumers: http_core::cache (the cache partition's site), and — owed to their own arcs — the cookie
# jar's public-suffix refusal (RFC 6265bis §5.7 step 9) and Aether's `security::origin::registrable_domain`.

[dependencies]
