[workspace]
resolver = "2"
members = [
    "libs/gneiss_pal",
    "libs/quartzite",
    "libs/elessar",
    "libs/resonance",
    "unaos/libs/fs/unafs",
    "libs/input/ibus",
    "unaos/libs/sys/helm",
    "libs/pwm/pca9685",
    "libs/bandy",
    "libs/euclase",
    "handlers/vein",
    "handlers/matrix",
    "handlers/vaire",
    "handlers/aule",
    "handlers/tabula",
    "handlers/midden",
    "handlers/amber_bytes",
    "handlers/stria",
    "handlers/aether",
    # "handlers/vug",
    "tools/vertex",
    "tools/unafs",
    "tools/unafs_bench",
    "tools/sentinel",
    "vessels/lumen",
    "vessels/pulse",
    "vessels/phonolite",
    "vessels/facet",
    "vessels/una",
    "libs/lux",
    "vessels/aether-shell"
]

# 🦅 MACH'S BRIDGE:
# By default, a bare `cargo build` will ONLY build our host-native tools and their dependencies.
# It will automatically target Mac (aarch64-apple-darwin).
default-members = [
    "vessels/lumen",
    "vessels/pulse",
    "vessels/phonolite",
    "vessels/facet",
    "vessels/una",
    "vessels/aether-shell",
    "tools/vertex",
    "tools/unafs",
    "tools/unafs_bench",
    "tools/sentinel"
]

# Dev builds keep our crates debuggable but compile dependencies optimized —
# selector matching / HTML parsing / rasterization live in deps, and a debug
# cascade on a rule-heavy page (wikipedia) costs ~40s CPU without this.
[profile.dev.package."*"]
opt-level = 2
