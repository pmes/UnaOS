[workspace]
resolver = "2"
members = [
    "libs/gneiss_pal",
    "libs/quartzite",
    "libs/text_host", # QUARTZFONT (SR64): the host font stack on font_core, shared by Aether and quartzite
    "libs/elessar",
    "libs/resonance",
    "unaos/libs/fs/unafs",
    "unaos/libs/media/demux_core",
    "libs/input/ibus",
    "unaos/libs/sys/helm",
    "unaos/libs/sys/midden_core",
    "unaos/libs/fs/exfat_core", # EXFAT (B392): the exFAT reader the kernel's removable volumes and the host KATs share
    "unaos/libs/sys/prefs_core",
    "unaos/libs/sys/wifi_core",
    "unaos/libs/sys/usbnet_core", # NETFRAME (B368): the USB Ethernet rx framing core the kernel driver and the host KATs share
    "unaos/libs/sys/vein_core",
    "unaos/libs/sys/diag_core",
    "unaos/libs/sys/amber_core",
    "unaos/libs/sys/tls_core",
    "unaos/libs/sys/crypto_core",
    # FONTCORE (SR48): the no_std font core (OpenType/TrueType/CFF, rasterizer, shaper, UAX #14).
    "unaos/libs/text/font_core",
    "unaos/libs/web/js_core", # JSCORE (SR55): ECMAScript 2025 from the specification, no_std, zero deps

    "unaos/libs/sys/elf_core", # STORMFAULT (B351): the ring-3 ELF segment plan both loaders share
    "unaos/libs/sys/type_core", # TYPECORE (B450): the one extension-to-MIME table, sniff order and ELF split both rings read
    "unaos/libs/sys/ldso_core", # SELFBUILD6 (B360): the dynamic loader core the kernel shim and the host runner share
    # VEINTLS (SR36): the ring-3 Vein library joins the host workspace so its offline TLS + Messages test runs here.
    "unaos/libs/sys/vein_ring3",
    "unaos/libs/media/audio_core",
    "unaos/libs/media/pixel_core",
    "unaos/libs/media/vp8_core",
    "unaos/libs/media/av1_core",
    # SVGCORE (SR52): the no_std SVG renderer (XML, paths, painting, text via font_core) behind pixel_core's `svg` format.
    "unaos/libs/media/svg_core",
    "unaos/libs/sys/holocron_core",

    # HTMLCORE (SR46): the no_std WHATWG HTML parser + arena DOM + serializer (Aether swaps kuchiki for it later).
    "unaos/libs/web/html_core",
    # CSSCORE (SR47): CSS Syntax 3 + Selectors 4 + the cascade helpers, no_std, zero deps.
    "unaos/libs/web/css_core",
    # HTTPCORE (SR51): the no_std HTTP client core (URL, HTTP/1.1, cookies, codings, h2) + its host transport.
    "unaos/libs/net/http_core",
    # GITCORE (SR59): the no_std git core (objects, deflate encoder, packs, index, refs, diff, smart HTTP).
    "unaos/libs/vcs/git_core",

    # INFERCORE (SR57): the no_std inference core (safetensors/ONNX readers, BERT tokenizer + encoder), zero deps.
    "unaos/libs/ml/infer_core",

    "libs/pwm/pca9685",
    "libs/bandy",
    "libs/euclase",
    "handlers/vein",
    "handlers/holocron",
    "handlers/matrix",
    "handlers/comscan",
    "handlers/vaire",
    "handlers/aule",
    "handlers/tabula",
    "handlers/midden",
    "handlers/amber_bytes",
    "handlers/stria",
    "handlers/aether",
    "handlers/principia",
    "handlers/facet",
    # "handlers/vug",
    "tools/vertex",
    "tools/play-check",
    "tools/aethervideo-check",
    "tools/unafs",
    "tools/una-card",
    "tools/unafs_bench",
    "tools/sentinel",
    "tools/audio-check",
    "tools/pixel-check",
    "tools/foreman",
    "tools/av1-check",
    "tools/holocron",
    "tools/crypto-check",
    "tools/eyes",
    "tools/una-res", # APPRES (B398): the program resource writer
    "vessels/lumen",
    "vessels/pulse",
    "vessels/phonolite",
    "vessels/facet-view",
    "vessels/una",
    "libs/lux",
    "vessels/aether-shell"
]

# 🦅 MACH'S BRIDGE:
# By default, a bare `cargo build` will ONLY build our host-native tools and their dependencies.
# It will automatically target Mac (aarch64-apple-darwin).
default-members = [
    "vessels/lumen",
    "vessels/pulse",
    "vessels/phonolite",
    "vessels/facet-view",
    "vessels/una",
    "vessels/aether-shell",
    "tools/vertex",
    "tools/unafs",
    "tools/unafs_bench",
    "tools/sentinel"
]

# Dev builds keep our crates debuggable but compile dependencies optimized —
# selector matching / HTML parsing / rasterization live in deps, and a debug
# cascade on a rule-heavy page (wikipedia) costs ~40s CPU without this.
[profile.dev.package."*"]
opt-level = 2

# The browser's own hot loops (pixel blits, glyph rasterization, cascade)
# live in these crates — run them optimized in dev too. Debugging them
# means flipping these to 0 locally, not shipping a pokey browser daily.
[profile.dev.package.aether]
opt-level = 2
[profile.dev.package.quartzite]
opt-level = 2
[profile.dev.package.aether-shell]
opt-level = 2

# HOLOCRON1: the keyring runs Argon2id (64 MiB, t=3) on every unlock; CRYPTOCORE is a workspace member, so
# the `"*"` rule above does not reach it. Optimised in dev too, or a debug `holocron unlock` takes seconds.
[profile.dev.package.crypto_core]
opt-level = 3
