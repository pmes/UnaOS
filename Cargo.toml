[workspace]
resolver = "2"
members = [
    "libs/gneiss_pal",
    "libs/quartzite",
    "libs/elessar",
    "libs/resonance",
    "unaos/libs/fs/unafs",
    "unaos/libs/media/demux_core",
    "libs/input/ibus",
    "unaos/libs/sys/helm",
    "unaos/libs/sys/midden_core",
    "unaos/libs/sys/prefs_core",
    "unaos/libs/sys/wifi_core",
    "unaos/libs/sys/vein_core",
    "unaos/libs/sys/diag_core",
    "unaos/libs/sys/amber_core",
    "unaos/libs/sys/tls_core",
    "unaos/libs/sys/crypto_core",
    "unaos/libs/sys/elf_core", # STORMFAULT (B351): the ring-3 ELF segment plan both loaders share
    # VEINTLS (SR36): the ring-3 Vein library joins the host workspace so its offline TLS + Messages test runs here.
    "unaos/libs/sys/vein_ring3",
    "unaos/libs/media/audio_core",
    "unaos/libs/media/pixel_core",
    "unaos/libs/media/vp8_core",
    "unaos/libs/media/av1_core",
    "unaos/libs/sys/holocron_core",
    "libs/pwm/pca9685",
    "libs/bandy",
    "libs/euclase",
    "handlers/vein",
    "handlers/holocron",
    "handlers/matrix",
    "handlers/comscan",
    "handlers/vaire",
    "handlers/aule",
    "handlers/tabula",
    "handlers/midden",
    "handlers/amber_bytes",
    "handlers/stria",
    "handlers/aether",
    "handlers/principia",
    "handlers/facet",
    # "handlers/vug",
    "tools/vertex",
    "tools/play-check",
    "tools/unafs",
    "tools/una-card",
    "tools/unafs_bench",
    "tools/sentinel",
    "tools/audio-check",
    "tools/pixel-check",
    "tools/foreman",
    "tools/av1-check",
    "tools/holocron",
    "tools/crypto-check",
    "tools/eyes",
    "vessels/lumen",
    "vessels/pulse",
    "vessels/phonolite",
    "vessels/facet-view",
    "vessels/una",
    "libs/lux",
    "vessels/aether-shell"
]

# 🦅 MACH'S BRIDGE:
# By default, a bare `cargo build` will ONLY build our host-native tools and their dependencies.
# It will automatically target Mac (aarch64-apple-darwin).
default-members = [
    "vessels/lumen",
    "vessels/pulse",
    "vessels/phonolite",
    "vessels/facet-view",
    "vessels/una",
    "vessels/aether-shell",
    "tools/vertex",
    "tools/unafs",
    "tools/unafs_bench",
    "tools/sentinel"
]

# Dev builds keep our crates debuggable but compile dependencies optimized —
# selector matching / HTML parsing / rasterization live in deps, and a debug
# cascade on a rule-heavy page (wikipedia) costs ~40s CPU without this.
[profile.dev.package."*"]
opt-level = 2

# The browser's own hot loops (pixel blits, glyph rasterization, cascade)
# live in these crates — run them optimized in dev too. Debugging them
# means flipping these to 0 locally, not shipping a pokey browser daily.
[profile.dev.package.aether]
opt-level = 2
[profile.dev.package.quartzite]
opt-level = 2
[profile.dev.package.aether-shell]
opt-level = 2

# HOLOCRON1: the keyring runs Argon2id (64 MiB, t=3) on every unlock; CRYPTOCORE is a workspace member, so
# the `"*"` rule above does not reach it. Optimised in dev too, or a debug `holocron unlock` takes seconds.
[profile.dev.package.crypto_core]
opt-level = 3
