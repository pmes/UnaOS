# =====================================================================
# CRATE: vessels/facet/Cargo.toml
# DESCRIPTION: The Image Vessel. A decoded picture given a window:
#              open a file, decode via lux, present it on screen.
# =====================================================================

[package]
name = "facet"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bandy = { path = "../../libs/bandy" }
euclase = { path = "../../libs/euclase" }
quartzite = { path = "../../libs/quartzite", default-features = false }
gneiss_pal = { path = "../../libs/gneiss_pal" }
lux = { path = "../../libs/lux" }

log = "0.4"
