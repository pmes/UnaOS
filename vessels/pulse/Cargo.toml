# =====================================================================
# CRATE: vessels/pulse/Cargo.toml
# DESCRIPTION: The System Monitor. Per-core CPU pulse, BeOS-Pulse style.
# =====================================================================

[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bandy = { path = "../../libs/bandy" }
quartzite = { path = "../../libs/quartzite", default-features = false }
gneiss_pal = { path = "../../libs/gneiss_pal" }

log = "0.4"
tokio = { version = "1.49", features = ["rt-multi-thread", "sync", "macros", "time", "signal"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
