[package]
name = "aether-shell"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
gtk4 = { version = "0.11.4", features = ["v4_14"], optional = true }
glib = { version = "0.22", optional = true }

[dependencies]
aether = { path = "../../handlers/aether" }
tokio = { version = "1", features = ["full"] }
cxx = { version = "1.0", optional = true }
cxx-qt = { version = "0.9", optional = true }
cxx-qt-lib = { version = "0.9", optional = true }

[build-dependencies]
cxx-qt-build = { version = "0.9", optional = true }

[features]
default = []
gtk = ["dep:gtk4", "dep:glib"]
qt = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib", "dep:cxx-qt-build"]

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
softbuffer = "0.4"
