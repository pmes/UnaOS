# =====================================================================
# CRATE: handlers/facet/Cargo.toml
# DESCRIPTION: The Canvas. The Images handler (CODEX §2, ledger SR29):
#              open + decode a picture, read its metadata, keep a
#              non-destructive edit list, render a view, export PNG —
#              served over the Bandy Synapse; `facet` is its CLI.
# =====================================================================

[package]
name = "facet"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[features]
# CHICKEN WIRE (R83): the `image` crate is the TEMPORARY decoder behind `ImageSource`, until
# PIXELCORE's `gneiss_pal::dsp::image` (unaos/libs/media/pixel_core, SR25) lands on trunk and
# `PixelCoreSource` replaces it. Nothing outside `source.rs` names the crate.
default = ["chicken-wire-image"]
chicken-wire-image = ["dep:image"]

[dependencies]
bandy = { path = "../../libs/bandy" }
tokio = { version = "1.53", features = ["rt", "sync", "macros"] }
log = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "qoi", "webp"], optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tempfile = "3.27.0"
toml = "1.1.6"
