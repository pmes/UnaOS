# =====================================================================
# CRATE: handlers/stria/Cargo.toml
# DESCRIPTION: The Studio handler. A bus-driven audio handler that owns
#              the resonance engine lifecycle and speaks SMessage on the
#              Bandy Synapse. Library crate — no window, no binary.
# =====================================================================

[package]
name = "stria"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
bandy = { path = "../../libs/bandy" }
resonance = { path = "../../libs/resonance" }
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
anyhow = "1.0"
log = "0.4"

[dev-dependencies]
# start_paused tests (auto-advancing time through the drain-timeout path)
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros", "test-util"] }
