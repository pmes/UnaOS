# =====================================================================
# CRATE: handlers/stria/Cargo.toml
# DESCRIPTION: The Studio handler. A bus-driven audio handler that owns
#              the resonance engine lifecycle and speaks SMessage on the
#              Bandy Synapse. Library crate — no window, no binary.
# =====================================================================

[package]
name = "stria"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
bandy = { path = "../../libs/bandy" }
resonance = { path = "../../libs/resonance" }
# PLAYBACK (SR26): the A/V pipeline pieces (dsp::demux, dsp::video, dsp::avsync, dsp::audio_track).
# AETHERMEDIA (SR107): `av1` puts AVCODEC's decoder (av1_core) in the registry (dsp/video.rs), so AV1 streams
# play real frames instead of the labelled stand-in.
# VP9CORE (SR116): VP9 (WebM V_VP9, MP4 vp09; profiles 0 and 2) plays real frames through gneiss_pal's
# unconditional `dsp::video::vp9` arm over unaos/libs/media/vp9_core, beside vp8_core — no feature to name.
# HEVCPAL (SR215): `hevc` puts HEVCPARSE's decoder (hevc_core) in the same registry: hvc1 / hev1 / V_MPEGH/ISO/HEVC intra streams
# play real frames, and the editor and Player derive HEVC Matroska decode times from hvcC.
gneiss_pal = { path = "../../libs/gneiss_pal", features = ["av1", "hevc"] }
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros"] }
anyhow = "1.0"
# NLE1 (SR194): the editor's timeline core (no_std, shared with the on-UnaOS face); `nle` renders its schedule.
timeline_core = { path = "../../unaos/libs/media/timeline_core" }
# NLE5B (SR206): the H.264 export encodes through H264ENC's encoder and its RGBA -> I420 (`yuv`), the tree's one converter.
h264enc_core = { path = "../../unaos/libs/media/h264enc_core" }
# NLE2 (SR201): the editor face names its clips through the host font stack quartzite's chrome uses (seat grant).
text_host = { path = "../../libs/text_host" }
log = "0.4"

[dev-dependencies]
# start_paused tests (auto-advancing time through the drain-timeout path)
tokio = { version = "1.53", features = ["rt", "sync", "time", "macros", "test-util"] }
