[package]
name = "vaire"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[features]
default = []
gtk = ["dep:gtk4", "dep:glib"]

[[bin]]
name = "vaire"
path = "src/bin/vaire.rs"

[dependencies]
anyhow = "1.0"
bandy = { path = "../../libs/bandy" }
# The dev-tree Bolt manifest is a versioned, commented config file the crate
# reads; serde + toml deserialize it (both already in the workspace lock).
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# GITCORE (SR59): repositories are read through UnaOS's own git implementation (git2 → gix → git_core).
# `std` gives the on-disk Repository (discover, HEAD, status/is_dirty, rev-parse, tree diff).
git_core = { path = "../../unaos/libs/vcs/git_core", features = ["std"] }
# The ledger chain hash is SHA-1 from CRYPTOCORE (the same primitive git_core names objects with).
crypto_core = { path = "../../unaos/libs/sys/crypto_core" }
# The vault-probe rides UnaFS's fail-closed mount check (read-only, host-native).
unafs = { path = "../../unaos/libs/fs/unafs" }
gtk4 = { version = "0.11.4", features = ["v4_12"], optional = true }
glib = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
