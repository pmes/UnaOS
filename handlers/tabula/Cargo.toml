[package]
name = "tabula"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[features]
# GTK view is off by default so the pure `TabulaDocument` core builds on macOS.
gtk = ["dep:gtk4", "dep:glib", "dep:sourceview5", "dep:libspelling"]

[dependencies]
elessar = { path = "../../libs/elessar" }
libspelling = { version = "0.5.0", optional = true }
gtk4 = { version = "0.11.4", features = ["v4_12"], optional = true }
glib = { version = "0.22", optional = true }
sourceview5 = { version = "0.11.1", optional = true }
