[package]
name = "tabula"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[features]
# GTK view is off by default so the pure `TabulaDocument` core builds on macOS.
gtk = ["dep:gtk4", "dep:glib", "dep:sourceview5", "dep:libspelling"]

[dependencies]
# EDITCORE (SR73): the UnaOS text-editing core — `TabulaDocument`'s buffer of record (no_std, zero deps).
edit_core = { path = "../../unaos/libs/text/edit_core" }
elessar = { path = "../../libs/elessar" }
# TABULABUS (SR74): `tabula::ignite` serves the Editor verbs on the Synapse.
bandy = { path = "../../libs/bandy" }
libspelling = { version = "0.5.0", optional = true }
gtk4 = { version = "0.11.4", features = ["v4_12"], optional = true }
glib = { version = "0.22", optional = true }
sourceview5 = { version = "0.11.1", optional = true }

[dev-dependencies]
# The bus KAT runs a real Synapse under a current-thread runtime (bandy's own tokio line).
tokio = { version = "1.53", features = ["sync", "rt", "macros"] }
