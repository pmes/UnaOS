<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>17 dynamic scripts</title></head>
<body>
<ul id="log"></ul>
<div id="host"></div>
<script>
window.trace = [];
function log(s) { var li = document.createElement('li'); li.textContent = String(s); document.getElementById('log').appendChild(li); }
var s1 = document.createElement('script');
s1.textContent = 'window.trace.push("inline-dynamic:" + (document.currentScript === s1 ? "self" : document.currentScript));';
window.trace.push('before-append');
document.body.appendChild(s1);
window.trace.push('after-append');
var s2 = document.createElement('script');
s2.src = '17-dyn.js';
s2.onload = function () { window.trace.push('onload:' + window.dynLoaded); };
window.trace.push('async-default:' + s2.async);
document.head.appendChild(s2);
window.trace.push('after-external-append:' + window.dynLoaded);
document.getElementById('host').innerHTML = '<script>window.trace.push("innerHTML-script-ran")<\/script>';
var s3 = document.createElement('script');
document.body.appendChild(s3);
window.trace.push('empty-appended');
s3.text = 'window.trace.push("text-later")';
var moved = document.createElement('script');
moved.textContent = 'window.trace.push("ran-once")';
document.body.appendChild(moved);
document.getElementById('host').appendChild(moved);
var bad = document.createElement('script');
bad.src = '17-missing.js';
bad.onerror = function () { window.badErr = 'onerror:missing'; };
document.body.appendChild(bad);
var typed = document.createElement('script');
typed.type = 'text/x-template';
typed.textContent = 'window.trace.push("template-ran")';
document.body.appendChild(typed);
setTimeout(function () { log(window.trace.join(' | ')); log(window.badErr); }, 50);
</script>
</body></html>
