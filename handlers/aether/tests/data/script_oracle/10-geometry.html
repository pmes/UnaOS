<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>10 geometry</title>
<style>
body { margin: 0; }
#stage { position: relative; width: 400px; height: 300px; margin: 20px 0 0 30px; }
#box { position: absolute; left: 50px; top: 40px; width: 100px; height: 60px; padding: 5px; border: 3px solid black; }
#inner { width: 20px; height: 10px; margin-left: 7px; }
#flow { width: 200px; height: 30px; margin: 10px; border-left: 4px solid red; }
</style></head>
<body>
<div id="stage"><div id="box"><div id="inner"></div></div></div>
<div id="flow"></div>
<ul id="log"></ul>
<script>
function log(s) { var li = document.createElement('li'); li.textContent = String(s); document.getElementById('log').appendChild(li); }
function r(id) { var b = document.getElementById(id).getBoundingClientRect(); return id + ' ' + [b.x, b.y, b.width, b.height, b.top, b.right, b.bottom, b.left].join(','); }
log(r('stage'));
log(r('box'));
log(r('inner'));
log(r('flow'));
var box = document.getElementById('box');
log('offset: ' + [box.offsetLeft, box.offsetTop, box.offsetWidth, box.offsetHeight, box.offsetParent.id].join(','));
log('client: ' + [box.clientLeft, box.clientTop, box.clientWidth, box.clientHeight].join(','));
var inner = document.getElementById('inner');
log('inner offset: ' + [inner.offsetLeft, inner.offsetTop, inner.offsetParent.id].join(','));
box.style.left = '70px';
box.style.width = '150px';
log('after mutation: ' + r('box'));
var rect = box.getBoundingClientRect();
log('DOMRect: ' + (rect instanceof DOMRect) + ' ' + (rect instanceof DOMRectReadOnly) + ' json=' + JSON.stringify(rect.toJSON()));
var d = new DOMRect(1, 2, 3, 4);
d.width = -10;
log('DOMRect math: ' + [d.left, d.right, d.width].join(','));
log('rects count: ' + box.getClientRects().length + ' detached: ' + document.createElement('div').getClientRects().length + ' zero=' + JSON.stringify(document.createElement('div').getBoundingClientRect().toJSON()));
log('viewport: ' + innerWidth + 'x' + innerHeight);
</script>
</body></html>
