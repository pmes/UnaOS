<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>12 inline handlers and errors</title></head>
<body onload="document.getElementById('log').insertAdjacentHTML('beforeend', '<li>body onload: ' + (event.type) + '</li>')">
<button id="b1" onclick="window.order.push('attr'); return false">b1</button>
<a id="lnk" href="#somewhere" onclick="window.clicked = this.id">link</a>
<div id="d" onmouseover="window.mo = 1">d</div>
<ul id="log"></ul>
<script>
window.order = [];
function log(s) { var li = document.createElement('li'); li.textContent = String(s); document.getElementById('log').appendChild(li); }
var b1 = document.getElementById('b1');
b1.addEventListener('click', function (e) { window.order.push('listener'); });
var ev = new MouseEvent('click', { bubbles: true, cancelable: true });
b1.dispatchEvent(ev);
log('order: ' + window.order.join(',') + ' defaultPrevented=' + ev.defaultPrevented);
log('onclick property: ' + typeof b1.onclick + ' ' + b1.onclick.name.length + ' ' + (document.getElementById('d').onmouseover !== null));
b1.onclick = function () { window.order.push('prop'); };
window.order = [];
b1.click();
log('replaced handler keeps position: ' + window.order.join(','));
b1.onclick = null;
window.order = [];
b1.click();
log('null handler: ' + window.order.join(','));
b1.setAttribute('onclick', 'window.order.push("reattr")');
window.order = [];
b1.click();
log('setAttribute handler: ' + window.order.join(','));
document.getElementById('lnk').click();
log('this in handler: ' + window.clicked);
window.errs = [];
window.onerror = function (msg, src, line, col, err) { window.errs.push(String(msg).replace(/^Uncaught /, '') + '|' + (err instanceof Error)); return true; };
window.addEventListener('error', function (e) { window.errs.push('listener:' + e.message.replace(/^Uncaught /, '') + ':' + e.cancelable); });
setTimeout(function () { throw new TypeError('from timer'); }, 0);
b1.addEventListener('boom', function () { throw new RangeError('from listener'); });
b1.addEventListener('boom', function () { window.errs.push('second listener ran'); });
b1.dispatchEvent(new Event('boom'));
setTimeout(function () { log('errors: ' + window.errs.join(' ; ')); }, 20);
var noHandler = document.createElement('div');
log('unset handler: ' + noHandler.onclick + ' window.onload type: ' + typeof window.onload);
</script>
<script>throw new Error('script-level ' + (1 + 1));</script>
<script>log('next script still runs');</script>
</body></html>
