[package]
name = "matrix"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[features]
gtk = ["dep:gtk4", "dep:glib"]

[dependencies]
anyhow = "1.0"
bandy = { path = "../../libs/bandy" }
elessar = { path = "../../libs/elessar" }
gneiss_pal = { path = "../../libs/gneiss_pal" }
gtk4 = { version = "0.11.4", features = ["v4_12"], optional = true }
glib = { version = "0.22", optional = true }
async-channel = "2.5"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
# TRASHTIME M3 (B308): the vault Trash; the key literals live once in una-abi (both rings link it).
unafs = { path = "../../unaos/libs/fs/unafs" }
una-abi = { path = "../../unaos/crates/una-abi" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
