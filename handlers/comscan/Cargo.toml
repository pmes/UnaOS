[package]
name = "comscan"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
bandy = { path = "../../libs/bandy" }
tokio = { version = "1.53", features = ["sync", "rt", "macros", "time"] }
# VUGCOMSCAN1 (SR476): the pump core and make_core's Program / Dialect (helm by path: VUGHELM SR475 folded first)
pump_core = { path = "../../unaos/libs/cad/pump_core" }
make_core = { path = "../../unaos/libs/cad/make_core" }
helm = { path = "../../unaos/libs/sys/helm" }
libc = "0.2" # VUGCOMSCANTTY (SR484): termios + TIOCEXCL + the 250000 speed ioctls for src/tty.rs (the installer's libc, Cargo.lock 0.2.190)
gneiss_pal = { path = "../../libs/gneiss_pal" } # VUGCOMSCANWS (SR499): api::http::ws, the tree's RFC 6455 client (AETHERNET SR70), used whole by src/ws.rs

[dev-dependencies]
tokio = { version = "1.53", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
principia = { path = "../principia" } # VUGCOMSCANPREFSUNA (SR628): tests/tty.rs keeps the declare through the real fulfiller
