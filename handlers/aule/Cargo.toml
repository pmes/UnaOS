[package]
name = "aule"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[features]
# GTK ignite button view is off by default so the portable `Aule` core builds on macOS.
gtk = ["dep:gtk4", "dep:glib", "dep:async-channel"]

[dependencies]
anyhow = "1.0"
bandy = { path = "../../libs/bandy" }
elessar = { path = "../../libs/elessar" }
gtk4 = { version = "0.11.4", features = ["v4_12"], optional = true }
glib = { version = "0.22", optional = true }
async-channel = { version = "2.5", optional = true }
