# =====================================================================
# CRATE: handlers/principia/Cargo.toml
# DESCRIPTION: The Architect. The policy engine: the persistent, namespaced
#              preference store for the whole of userspace, served over the
#              Bandy Synapse. Library crate — no window, no binary.
# =====================================================================

[package]
name = "principia"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
bandy = { path = "../../libs/bandy" }
# PREFS (rmbp-ledger B300): the shared no_std core — the validation rule and the TOML subset codec the
# kernel reads and writes this store with. PRINCIPIAFILES (B445): the store is prefs_core's `files` folder
# (`<home>/settings/<domain>`), read and written ONLY through prefs_core — no second (lenient) TOML parser.
prefs_core = { path = "../../unaos/libs/sys/prefs_core" }
tokio = { version = "1.53", features = ["rt", "sync", "macros"] }
anyhow = "1.0"
dirs = "7.0"
log = "0.4"

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
