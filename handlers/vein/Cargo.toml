[package]
name = "vein"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

# ==================================================================================
# THE VEIN HANDLER
# The AI Cortex. The Mind.
# Integrates LLM reasoning, Context Retrieval, and Semantic Memory.
# ==================================================================================

[features]
# EMBED (B317): the in-process local embedder (recall with no network).
default = ["local-embed"] # R85 (17): the local embedder is ON by default; since INFERCORE (SR57) it runs on UnaOS's own infer_core (no_std, zero deps; candle is gone); see docs/dev/evidence/ml-1005/INFERCORE.md
local-embed = ["gneiss_pal/local-embed"]

[dependencies]
# The Trinity
bandy = { path = "../../libs/bandy" }
gneiss_pal = { path = "../../libs/gneiss_pal" }
unafs = { path = "../../unaos/libs/fs/unafs" }
una-abi = { path = "../../unaos/crates/una-abi" } # ATTRKEYS (B452): the embed keys live in the one registry
elessar = { path = "../../libs/elessar" }
# VEINCORE (B304): the shared no_std core — conversation model, pure context assembler, chat bus codec —
# the SAME crate the ring-3 VEIN.BIN and the kernel link.
vein_core = { path = "../../unaos/libs/sys/vein_core" }
quartzite = { path = "../../libs/quartzite" }
matrix = { path = "../../handlers/matrix" }
# VEINPROV (B303): the provider choice is a preference — read from Principia's store, namespace `vein`.
principia = { path = "../../handlers/principia" }
# HOLOCRON1 (SR33): the Claude API key is asked of Holocron first (SecretGet vein/claude.api_key).
holocron = { path = "../holocron" }
syn = { version = "3.0", features = ["full", "extra-traits"] }
quote = "1.0"

# Async & Runtime
tokio = { version = "1.53", features = ["full"] }
# The universal nervous system. No UI dependencies allowed here.
async-channel = "2.5"
futures = "0.3"

# Networking & AI
# HTTPCORE (SR51): HTTP goes through gneiss_pal::api::http (UnaOS's http_core + tls_core); reqwest is gone.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
log = "0.4"
chrono = "0.4"
anyhow = "1.0"
rand = "0.10"

[dev-dependencies]
# Isolated temp dirs for the vault DiskManager fail-closed (AMBER-GUARD) tests.
tempfile = "3"
# HOLOCRON1: the INSECURE test suite for the provider-slot tests' in-process Holocron (fast KDF).
holocron_core = { path = "../../unaos/libs/sys/holocron_core", features = ["test-suite"] }
