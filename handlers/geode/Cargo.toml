[package]
name = "geode"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Geode — CODEX §2's Archives. GEODEMETA (LEDGER SR148): the .geode archive carries UnaFS records whole (every attribute, the three times), so UnaFS -> .geode -> UnaFS keeps them."

[lib]
path = "src/lib.rs"

[dependencies]
# The store and its record codec (docs/dev/OS/09_FILESYSTEM/unafs-records.md §R1/§R5): the archive's attribute
# bytes ARE the §R5 bytes, written and read by unafs::codec, never a second encoder.
unafs = { path = "../../unaos/libs/fs/unafs" }

[dev-dependencies]
# GATE-ATTRKEYS: the tests name registered keys by their constants, never by a literal.
una-abi = { path = "../../unaos/crates/una-abi" }
