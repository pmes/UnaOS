[package]
name = "euclase"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
libm = "0.2"
log = "0.4"
# Blocks the async adapter/device handshake for synchronous vessel bootstrap
# (Cortex::ignite_layer_blocking). Tiny by design.
pollster = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
wgpu = "30.0"

[features]
default = []
serde = ["dep:serde"]
