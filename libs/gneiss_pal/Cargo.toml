[package]
name = "gneiss_pal"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[features]
default = ["std"]
std = ["dep:http_core", "tokio", "futures-core", "futures-util"]
# EMBED (B317): the in-process local embedder (all-MiniLM-L6-v2 on candle, CPU).
# PLAYBACK (SR26): AVCODEC's AV1 decoder (`unaos/libs/media/av1_core`, LEDGER SR24) behind
# `dsp::video::av1` (folded on host-merge1: the real adapter, key + intra-only frames today).
av1 = ["dep:av1_core"]
local-embed = ["std", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:unicode-normalization"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
log = "0.4"
# HTTPCORE (SR51): UnaOS's own HTTP client (URL, HTTP/1.1, cookies, codings) + its host transport (std TCP +
# tls_core verified TLS 1.3 + CRYPTOCORE) behind `api::http` — replaced reqwest and octocrab (and tokio-tungstenite
# in Aether). No third-party crate under it.
http_core = { path = "../../unaos/libs/net/http_core", features = ["host"], optional = true }
# VEINPROV (B303): the provider seam — the shared backoff sleeps on tokio's timer; streams are futures Streams.
# CLAUDECODE (SR38): `process` + `io-util` + `rt` — the Claude Code provider spawns the CLI and reads its stdout line by line.
# HTTPCORE (SR51): `sync` — api::http's connection threads report through tokio's mpsc (runtime-agnostic).
tokio = { version = "1.53", features = ["time", "process", "io-util", "rt", "sync"], optional = true }
futures-core = { version = "0.3", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
chrono = { version = "0.4", default-features = false }
bandy = { version = "0.1.0", path = "../bandy", default-features = false }
# AUDIOCODEC (SR30): `dsp::audio` re-exports the no_std audio decoders the kernel links too.
audio_core = { path = "../../unaos/libs/media/audio_core" }
av1_core = { path = "../../unaos/libs/media/av1_core", optional = true, features = ["std"] }
# PIXELCORE (SR25): the still-image decoders UnaOS owns (no_std, zero deps) — re-exported as `dsp::image`.
pixel_core = { path = "../../unaos/libs/media/pixel_core" }
# EMBED (B317): the local embedder — candle on the CPU (BERT), NFD for the WordPiece normaliser.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
unicode-normalization = { version = "0.1", optional = true }

# PLAYBACK (SR26): the container core `dsp::demux` re-exports (`no_std`, no dependencies).
demux_core = { path = "../../unaos/libs/media/demux_core" }
# VP8CORE (SR40): the from-spec VP8 decoder behind `dsp::video::vp8` (`no_std`, no dependencies).
vp8_core = { path = "../../unaos/libs/media/vp8_core" }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "macros", "time"] }
