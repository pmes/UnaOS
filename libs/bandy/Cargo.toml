[package]
name = "bandy"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# THE FIX: Ignite the 'std' feature so we can allocate the logger on the heap.
log = { version = "0.4", features = ["std"] }
chrono = "0.4"
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["sync", "rt", "macros"] }
async-channel = "2.5.0"
# TYPECORE (rmbp-ledger B450, R79): the one extension-to-MIME table the kernel's fs/filetype.rs reads too.
type_core = { path = "../../unaos/libs/sys/type_core" }
